              time.</p>
            <p class="lang ja active">ORPHE CORE
              JSをすぐに試してみたい場合は、下記リンクをクリックしてChromeブラウザ（iOSの場合は
              bluefy）でp5.jsを使ってください。プログラムを初めて実行する際には、ポップアップウィンドウを許可する必要があることを覚えておいてください。
            </p>
            <ul>
              <li><a href="https://editor.p5js.org/tetsuakibaba/sketches/qQPilLD-i" target="_blank">P5.js Quick Start
                  with

            <p class="lang en ms-4">p5.js is a JavaScript library for creative coding, with a focus on making coding
              accessible
              and
              inclusive
              for artists, designers, educators, beginners, and anyone else! p5.js is free and open-source because we
              believe software, and the tools to learn it, should be accessible to everyone.</p>

              p5.jsは無料でオープンソースです。ソフトウェアとそれを学ぶためのツールは、誰にでもアクセス可能であるべきだと考えているからです。

  <script src="../js/bootstrap.bundle.min.js"
    integrity="sha384-pprn3073KE6tl6bjs2QrFaJGz5/SUsLqktiwsUTF55Jfv3qYSDhgCecCxMW52nD2"
    crossorigin="anonymous"></script>
  <script>
    let lang = 'ja';
    function toggleLanguage() {
      if (lang == 'ja') {
        lang = 'en';
      } else {
        lang = 'ja';
      }
      document.querySelectorAll('.lang').forEach(element => {
        if (element.classList.contains(lang)) {
          element.style.display = 'block';
          setTimeout(() => {
            element.classList.add('active');
          }, 10);
        } else {
          element.classList.remove('active');
          setTimeout(() => {
            element.style.display = 'none';
          }, 500);
        }
      });
    }
  </script>
