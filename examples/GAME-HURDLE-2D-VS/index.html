<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🏃 ハイパーハードル 110m VS 🏃</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      margin: 0;
      font-family: 'Press Start 2P', system-ui, -apple-system, monospace;
      background: linear-gradient(180deg, #1a1a2e 0%, #16213e 100%);
      color: #fff;
      overflow-x: hidden;
    }
    h1 {
      text-align: center;
      margin: 20px 0;
      font-size: 2rem;
      text-shadow: 4px 4px 0px rgba(0,0,0,0.5);
      color: #FFD700;
      letter-spacing: 2px;
    }
    #game-container {
      position: relative;
      margin: 20px auto;
      max-width: 1200px;
      background: #000;
      border: 4px solid #FFD700;
      box-shadow: 0 0 20px rgba(255, 215, 0, 0.5);
    }
    #game-canvas {
      display: block;
      width: 100%;
      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }
    .btn {
      background: linear-gradient(180deg, #4CAF50, #2E7D32);
      color: white;
      border: 3px solid #1B5E20;
      padding: 12px 30px;
      font-size: 14px;
      cursor: pointer;
      box-shadow: 0 4px 0 #1B5E20;
      transition: all 0.1s;
      font-family: 'Press Start 2P', monospace;
    }
    .btn:hover {
      background: linear-gradient(180deg, #66BB6A, #388E3C);
      transform: translateY(2px);
      box-shadow: 0 2px 0 #1B5E20;
    }
    .center {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
    }
    .description {
      text-align: center;
      margin: 15px auto;
      padding: 0 20px;
      max-width: 900px;
      font-size: 12px;
      line-height: 1.8;
    }
    #config-panel {
      margin: 20px auto;
      padding: 20px;
      background-color: #2a2a3e;
      border-radius: 10px;
      max-width: 1200px;
      border: 2px solid rgba(0,188,212,0.3);
    }
    #config-panel h3 {
      text-align: center;
      margin-bottom: 15px;
      color: #00bcd4;
      font-size: 16px;
    }
    .toolkit-container {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin: 15px 0;
    }
    .player-toolkits {
      background: #1a1a2e;
      padding: 15px;
      border-radius: 8px;
    }
    #finish-layer {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.9);
      display: none;
      z-index: 1000;
    }
    .card {
      background: linear-gradient(180deg, #2a2a3e, #1a1a2e);
      padding: 40px;
      border-radius: 15px;
      border: 3px solid #FFD700;
      box-shadow: 0 0 30px rgba(255, 215, 0, 0.5);
    }
  </style>
</head>
<body>
  <!-- Title -->
  <h1>🏃 ハイパーハードル 110m VS 🏃</h1>

  <!-- Game description -->
  <div class="description">
    <div>
      2人対戦の110mハードル走ゲーム！ハイパーオリンピック風の2Dグラフィック<br>
      Player 1: ↑でジャンプ、→で加速 | Player 2: Wでジャンプ、Dで加速<br>
      (またはORPHE COREデバイスで操作)
    </div>
  </div>

  <!-- CoreToolkit connection UI -->
  <div id="config-panel">
    <h3>📱 ORPHE CORE 接続</h3>
    <div class="toolkit-container">
      <div class="player-toolkits">
        <h4>👤 Player 1</h4>
        <div id="toolkit_p1"></div>
      </div>
      <div class="player-toolkits">
        <h4>👤 Player 2</h4>
        <div id="toolkit_p2"></div>
      </div>
    </div>
  </div>

  <!-- Game canvas -->
  <div id="game-container">
    <canvas id="game-canvas" width="1200" height="600"></canvas>
  </div>

  <!-- Start button -->
  <div style="margin: 30px auto; text-align: center;">
    <div class="btn" id="start-btn" style="display: inline-block;">
      🏁 スタート / START 🏁
    </div>
  </div>

  <!-- Finish screen -->
  <div class="center" id="finish-layer">
    <div class="card">
      <h1 id="winner-text" style="font-size: 48px; margin-bottom: 20px;">FINISH!</h1>
      <p style="font-size: 80px; font-weight: 900; color: #00ff00; margin: 20px 0;">
        <span id="winner-time">0.00</span><span style="font-size: 32px;">s</span>
      </p>
      <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 20px 0;">
        <div>
          <p style="font-size: 16px; color: #FF6B6B;">Player 1</p>
          <p>タイム: <b id="p1-final-time">—</b></p>
          <p>ヒット: <b id="p1-final-hits">—</b></p>
        </div>
        <div>
          <p style="font-size: 16px; color: #4ECDC4;">Player 2</p>
          <p>タイム: <b id="p2-final-time">—</b></p>
          <p>ヒット: <b id="p2-final-hits">—</b></p>
        </div>
      </div>
      <div class="btn" id="retry" style="margin-top: 20px;">もう一度 / RETRY</div>
    </div>
  </div>

  <!-- ORPHE CORE -->
  <script src="https://cdn.jsdelivr.net/gh/Orphe-OSS/ORPHE-CORE.js/js/ORPHE-CORE.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/gh/Orphe-OSS/ORPHE-CORE.js/js/CoreToolkit.js" crossorigin="anonymous"></script>

  <script>
    // Game constants
    const COURSE_LEN_M = 110;
    const HURDLES = 10;
    const FIRST_HURDLE_M = 13.72;
    const HURDLE_SPACING_M = 9.14;
    const HURDLE_HEIGHT_M = 0.84;

    // Physics
    const JUMP_V0 = 5.0;
    const GRAVITY = 16.0;
    const BASE_SPEED = 0.0;
    const MAX_SPEED = 12.0;
    const ACCEL_RATE = 15.0;
    const FRICTION = 8.0;
    const SLOWDOWN_FACTOR = 0.20;
    const RECOVER_SEC = 1.0;

    // Stamina
    const STAMINA_MAX = 1.0;
    const STAMINA_USE_PER_SEC = 0.45;
    const STAMINA_REGEN_PER_SEC = 0.45;
    const STAMINA_BLOCK_THRESHOLD = 0.08;

    // 2D Display constants
    const PIXELS_PER_METER = 10;  // 1m = 10px
    const PLAYER_SCREEN_X = 400;  // Player固定X位置
    const PLAYER_SIZE = 64;        // キャラクターサイズ
    const GROUND_Y1 = 250;         // Player1 地面Y座標
    const GROUND_Y2 = 480;         // Player2 地面Y座標
    const JUMP_PIXEL_SCALE = 30;   // ジャンプ高さのピクセル倍率

    // ORPHE thresholds
    window.player1Thresholds = { accel: 0.3, pitch: 0.1 };
    window.player2Thresholds = { accel: 0.3, pitch: 0.1 };

    // Canvas setup
    const canvas = document.getElementById('game-canvas');
    const ctx = canvas.getContext('2d');
    ctx.imageSmoothingEnabled = false; // ピクセルアート用

    // Game state
    let gameState = 'ready'; // 'ready', 'running', 'finished'
    let firstFinisher = null;

    // Player Class (2D Version)
    class Player {
      constructor(id, groundY, color) {
        this.id = id;
        this.groundY = groundY;
        this.color = color;

        // Position (in meters)
        this.position = 0;  // Distance traveled
        this.velocity = BASE_SPEED;

        // Jump state
        this.jumpY = 0;
        this.jumpVelocity = 0;
        this.isJumping = false;
        this.isGround = true;

        // Game state
        this.state = 'ready'; // 'ready', 'running', 'finished'
        this.stamina = STAMINA_MAX;
        this.hits = 0;
        this.runTime = 0;
        this.startTime = 0;
        this.finishTime = 0;
        this.finished = false;
        this.slowRemain = 0;

        // Input
        this.accelPressed = false;
        this.accelPressedOrphe = false;

        // Animation
        this.animFrame = 0;
        this.animTimer = 0;
        this.animState = 'idle'; // 'idle', 'run', 'jump', 'hit'
      }

      jump() {
        if (this.state !== 'running') return;
        if (!this.isGround) return;

        this.jumpVelocity = JUMP_V0;
        this.isJumping = true;
        this.isGround = false;
        this.animState = 'jump';
      }

      setAccelPressed(pressed) {
        this.accelPressedOrphe = pressed;
      }

      start() {
        this.state = 'running';
        this.startTime = performance.now();
      }

      update(dt) {
        if (this.state !== 'running' || this.finished) return;

        this.runTime = (performance.now() - this.startTime) / 1000;

        // Stamina & Acceleration
        const canAccel = (this.accelPressed || this.accelPressedOrphe) && (this.stamina > STAMINA_BLOCK_THRESHOLD);
        if (canAccel) {
          this.stamina -= STAMINA_USE_PER_SEC * dt;
          if (this.stamina < 0) this.stamina = 0;
          this.velocity += ACCEL_RATE * dt;
        } else {
          this.stamina += STAMINA_REGEN_PER_SEC * dt;
          if (this.stamina > STAMINA_MAX) this.stamina = STAMINA_MAX;
          if (this.velocity > BASE_SPEED) {
            this.velocity -= FRICTION * dt;
            if (this.velocity < BASE_SPEED) this.velocity = BASE_SPEED;
          }
        }

        if (this.velocity > MAX_SPEED) this.velocity = MAX_SPEED;

        // Slowdown from hit
        if (this.slowRemain > 0) {
          this.slowRemain -= dt;
          const t = Math.max(0, this.slowRemain) / RECOVER_SEC;
          this.velocity = this.velocity * (1 - t) + (this.velocity * SLOWDOWN_FACTOR) * t;
        }

        // Jump physics
        if (!this.isGround) {
          this.jumpVelocity -= GRAVITY * dt;
          this.jumpY += this.jumpVelocity * dt;

          if (this.jumpY <= 0) {
            this.jumpY = 0;
            this.jumpVelocity = 0;
            this.isGround = true;
            this.isJumping = false;
            this.animState = 'run';
          }
        }

        // Move forward
        this.position += this.velocity * dt;

        // Animation
        this.animTimer += dt;
        if (this.animTimer > 0.1) {
          this.animTimer = 0;
          this.animFrame = (this.animFrame + 1) % 4;
        }

        if (this.isGround && this.velocity > 1) {
          this.animState = 'run';
        } else if (this.isGround) {
          this.animState = 'idle';
        }

        // Check finish
        if (this.position >= COURSE_LEN_M && !this.finished) {
          this.finished = true;
          this.finishTime = this.runTime;
          if (!firstFinisher) {
            firstFinisher = this;
          }
        }
      }

      hitHurdle() {
        this.hits++;
        this.slowRemain = RECOVER_SEC;
        this.velocity *= SLOWDOWN_FACTOR;
        this.animState = 'hit';
      }

      reset() {
        this.position = 0;
        this.velocity = BASE_SPEED;
        this.jumpY = 0;
        this.jumpVelocity = 0;
        this.isJumping = false;
        this.isGround = true;
        this.state = 'ready';
        this.stamina = STAMINA_MAX;
        this.hits = 0;
        this.runTime = 0;
        this.finishTime = 0;
        this.finished = false;
        this.slowRemain = 0;
        this.accelPressed = false;
        this.accelPressedOrphe = false;
        this.animFrame = 0;
        this.animState = 'idle';
      }
    }

    // Create players
    const player1 = new Player(1, GROUND_Y1, '#FF6B6B');
    const player2 = new Player(2, GROUND_Y2, '#4ECDC4');

    // Draw detailed pixel art character (Hyper Olympic style)
    function drawCharacter(x, y, color, animState, animFrame) {
      const p = 4; // pixel size
      ctx.save();
      ctx.translate(x, y);

      // Skin tone
      const skinColor = '#FFD0A0';
      const shoeColor = '#000000';

      if (animState === 'run') {
        const frame = animFrame % 4;

        // Head
        ctx.fillStyle = skinColor;
        ctx.fillRect(6*p, 0, 8*p, 6*p);

        // Hair
        ctx.fillStyle = '#4A3020';
        ctx.fillRect(6*p, 0, 8*p, 3*p);

        // Body (uniform)
        ctx.fillStyle = color;
        ctx.fillRect(5*p, 6*p, 10*p, 8*p);

        // Arms
        if (frame < 2) {
          ctx.fillRect(3*p, 7*p, 3*p, 6*p); // Left arm forward
          ctx.fillRect(14*p, 9*p, 3*p, 5*p); // Right arm back
        } else {
          ctx.fillRect(3*p, 9*p, 3*p, 5*p); // Left arm back
          ctx.fillRect(14*p, 7*p, 3*p, 6*p); // Right arm forward
        }

        // Legs
        ctx.fillStyle = skinColor;
        if (frame < 2) {
          ctx.fillRect(6*p, 14*p, 4*p, 7*p); // Left leg
          ctx.fillRect(11*p, 14*p, 4*p, 5*p); // Right leg bent
        } else {
          ctx.fillRect(6*p, 14*p, 4*p, 5*p); // Left leg bent
          ctx.fillRect(11*p, 14*p, 4*p, 7*p); // Right leg
        }

        // Shoes
        ctx.fillStyle = shoeColor;
        if (frame < 2) {
          ctx.fillRect(5*p, 20*p, 5*p, 3*p);
          ctx.fillRect(10*p, 18*p, 5*p, 3*p);
        } else {
          ctx.fillRect(5*p, 18*p, 5*p, 3*p);
          ctx.fillRect(10*p, 20*p, 5*p, 3*p);
        }

      } else if (animState === 'jump') {
        // Head
        ctx.fillStyle = skinColor;
        ctx.fillRect(6*p, 0, 8*p, 6*p);

        // Hair
        ctx.fillStyle = '#4A3020';
        ctx.fillRect(6*p, 0, 8*p, 3*p);

        // Body
        ctx.fillStyle = color;
        ctx.fillRect(5*p, 6*p, 10*p, 8*p);

        // Arms (up)
        ctx.fillRect(2*p, 4*p, 4*p, 6*p);
        ctx.fillRect(14*p, 4*p, 4*p, 6*p);

        // Legs (bent)
        ctx.fillStyle = skinColor;
        ctx.fillRect(6*p, 14*p, 4*p, 4*p);
        ctx.fillRect(11*p, 14*p, 4*p, 4*p);

        // Shoes
        ctx.fillStyle = shoeColor;
        ctx.fillRect(4*p, 17*p, 5*p, 3*p);
        ctx.fillRect(11*p, 17*p, 5*p, 3*p);

      } else {
        // Idle
        ctx.fillStyle = skinColor;
        ctx.fillRect(6*p, 0, 8*p, 6*p);

        ctx.fillStyle = '#4A3020';
        ctx.fillRect(6*p, 0, 8*p, 3*p);

        ctx.fillStyle = color;
        ctx.fillRect(5*p, 6*p, 10*p, 8*p);

        ctx.fillRect(3*p, 8*p, 3*p, 6*p);
        ctx.fillRect(14*p, 8*p, 3*p, 6*p);

        ctx.fillStyle = skinColor;
        ctx.fillRect(7*p, 14*p, 4*p, 6*p);
        ctx.fillRect(10*p, 14*p, 4*p, 6*p);

        ctx.fillStyle = shoeColor;
        ctx.fillRect(6*p, 19*p, 5*p, 3*p);
        ctx.fillRect(10*p, 19*p, 5*p, 3*p);
      }

      ctx.restore();
    }

    // Draw hurdle (improved pixel art style)
    function drawHurdle(x, y) {
      const width = 64;
      const height = 48;
      const p = 4; // pixel size

      // Left post
      ctx.fillStyle = '#333333';
      ctx.fillRect(x - 8, y, 8, height + 12);

      // Right post
      ctx.fillRect(x + width, y, 8, height + 12);

      // Top bar with diagonal stripes
      const stripes = 8;
      const stripeW = width / stripes;
      for (let i = 0; i < stripes; i++) {
        ctx.fillStyle = i % 2 === 0 ? '#FFFFFF' : '#000000';
        ctx.fillRect(x + i * stripeW, y, stripeW, 12);
      }

      // Vertical bars
      for (let i = 0; i < 4; i++) {
        ctx.fillStyle = i % 2 === 0 ? '#FFFFFF' : '#000000';
        ctx.fillRect(x + i * 16, y + 12, 16, height - 12);
      }

      // Shadow
      ctx.fillStyle = 'rgba(0, 0, 0, 0.3)';
      ctx.fillRect(x - 8, y + height + 12, width + 16, 4);
    }

    // Draw background
    function drawBackground(scrollOffset) {
      // Sky
      const gradient = ctx.createLinearGradient(0, 0, 0, 150);
      gradient.addColorStop(0, '#5B9BD5');
      gradient.addColorStop(1, '#87CEEB');
      ctx.fillStyle = gradient;
      ctx.fillRect(0, 0, canvas.width, 150);

      // Colorful crowd (pixel art spectators)
      const crowdColors = ['#FF4444', '#44FF44', '#4444FF', '#FFFF44', '#FF44FF', '#44FFFF', '#FFA500', '#FF69B4'];
      for (let i = 0; i < 60; i++) {
        const cx = (i * 20) % canvas.width;
        const cy = 50 + Math.sin(i * 0.5) * 20;
        const colorIdx = i % crowdColors.length;

        // Head
        ctx.fillStyle = crowdColors[colorIdx];
        ctx.fillRect(cx, cy, 12, 12);

        // Body
        ctx.fillRect(cx + 2, cy + 12, 8, 10);
      }

      // Stadium structure
      ctx.fillStyle = '#8B7355';
      ctx.fillRect(0, 140, canvas.width, 10);

      // Ground - Bright green track
      ctx.fillStyle = '#00C853'; // Bright green
      ctx.fillRect(0, 150, canvas.width, 450);

      // Lane lines (white dashed)
      ctx.strokeStyle = '#FFFFFF';
      ctx.lineWidth = 3;
      ctx.setLineDash([20, 10]);

      for (let x = scrollOffset % 30; x < canvas.width; x += 30) {
        ctx.beginPath();
        ctx.moveTo(x, GROUND_Y1 + 10);
        ctx.lineTo(x + 20, GROUND_Y1 + 10);
        ctx.stroke();

        ctx.beginPath();
        ctx.moveTo(x, GROUND_Y2 + 10);
        ctx.lineTo(x + 20, GROUND_Y2 + 10);
        ctx.stroke();
      }

      ctx.setLineDash([]);

      // Divider line between lanes
      ctx.strokeStyle = '#FFFFFF';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(0, 300);
      ctx.lineTo(canvas.width, 300);
      ctx.stroke();
    }

    // Draw HUD
    function drawHUD(player, x, y) {
      ctx.font = '12px monospace';
      ctx.fillStyle = '#FFFFFF';

      const dist = Math.max(0, COURSE_LEN_M - player.position);
      ctx.fillText(`${dist.toFixed(1)}m`, x, y);

      // Stamina bar
      const barW = 150;
      const barH = 10;
      ctx.fillStyle = '#333';
      ctx.fillRect(x, y + 10, barW, barH);

      const staminaColor = player.stamina > 0.5 ? '#00FF00' : player.stamina > 0.2 ? '#FFFF00' : '#FF0000';
      ctx.fillStyle = staminaColor;
      ctx.fillRect(x, y + 10, barW * player.stamina, barH);

      ctx.fillStyle = '#FFFFFF';
      ctx.fillText(`Hits: ${player.hits}`, x, y + 35);
      ctx.fillText(`Time: ${player.runTime.toFixed(2)}s`, x, y + 50);
    }

    // Draw speed display under player (Hyper Olympic style)
    function drawSpeedDisplay(player, x, y) {
      const speedCmPerSec = Math.round(player.velocity * 100); // m/s to cm/s

      ctx.font = 'bold 16px monospace';
      ctx.fillStyle = '#000000';
      ctx.fillRect(x - 40, y + 5, 80, 25);

      ctx.fillStyle = '#FFFF00';
      ctx.fillRect(x - 38, y + 7, 76, 21);

      ctx.fillStyle = '#FF0000';
      ctx.textAlign = 'center';
      ctx.fillText(`${speedCmPerSec}`, x, y + 22);

      ctx.font = '10px monospace';
      ctx.fillStyle = '#000000';
      ctx.fillText('cm/sec', x, y + 32);

      ctx.textAlign = 'left';
    }

    // Collision detection
    function checkHurdleCollision(player) {
      for (let i = 0; i < HURDLES; i++) {
        const hurdlePos = FIRST_HURDLE_M + i * HURDLE_SPACING_M;
        const hurdleDist = Math.abs(player.position - hurdlePos);

        if (hurdleDist < 0.5 && player.jumpY < HURDLE_HEIGHT_M) {
          player.hitHurdle();
          return;
        }
      }
    }

    // Main render function
    function render() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Calculate scroll offset
      const scrollOffset1 = -(player1.position * PIXELS_PER_METER - PLAYER_SCREEN_X);
      const scrollOffset2 = -(player2.position * PIXELS_PER_METER - PLAYER_SCREEN_X);

      // Draw background
      drawBackground(scrollOffset1);

      // Draw hurdles for Player 1
      for (let i = 0; i < HURDLES; i++) {
        const hurdlePos = FIRST_HURDLE_M + i * HURDLE_SPACING_M;
        const screenX = hurdlePos * PIXELS_PER_METER + scrollOffset1;
        if (screenX > -100 && screenX < canvas.width + 100) {
          drawHurdle(screenX, GROUND_Y1 - 50);
        }
      }

      // Draw hurdles for Player 2
      for (let i = 0; i < HURDLES; i++) {
        const hurdlePos = FIRST_HURDLE_M + i * HURDLE_SPACING_M;
        const screenX = hurdlePos * PIXELS_PER_METER + scrollOffset2;
        if (screenX > -100 && screenX < canvas.width + 100) {
          drawHurdle(screenX, GROUND_Y2 - 50);
        }
      }

      // Draw Player 1
      const p1Y = GROUND_Y1 - PLAYER_SIZE - (player1.jumpY * JUMP_PIXEL_SCALE);
      drawCharacter(PLAYER_SCREEN_X, p1Y, player1.color, player1.animState, player1.animFrame);
      drawSpeedDisplay(player1, PLAYER_SCREEN_X + 32, p1Y + PLAYER_SIZE + 10);

      // Draw Player 2
      const p2Y = GROUND_Y2 - PLAYER_SIZE - (player2.jumpY * JUMP_PIXEL_SCALE);
      drawCharacter(PLAYER_SCREEN_X, p2Y, player2.color, player2.animState, player2.animFrame);
      drawSpeedDisplay(player2, PLAYER_SCREEN_X + 32, p2Y + PLAYER_SIZE + 10);

      // Draw HUD
      drawHUD(player1, 20, 30);
      drawHUD(player2, 20, 330);

      // Check for finish
      if (player1.finished && player2.finished && gameState === 'running') {
        gameState = 'finished';
        showFinishScreen();
      }
    }

    // Game loop
    let lastTime = performance.now();
    function loop() {
      const now = performance.now();
      const dt = Math.min((now - lastTime) / 1000, 0.1);
      lastTime = now;

      if (gameState === 'running') {
        player1.update(dt);
        player2.update(dt);

        checkHurdleCollision(player1);
        checkHurdleCollision(player2);
      }

      render();
      requestAnimationFrame(loop);
    }

    // Game controls
    function startGame() {
      gameState = 'running';
      player1.start();
      player2.start();
      document.getElementById('start-btn').style.display = 'none';
    }

    function resetGame() {
      gameState = 'ready';
      firstFinisher = null;
      player1.reset();
      player2.reset();
      document.getElementById('finish-layer').style.display = 'none';
      document.getElementById('start-btn').style.display = 'inline-block';
    }

    function showFinishScreen() {
      const winner = firstFinisher;
      const winnerId = winner.id;

      document.getElementById('winner-text').textContent = `Player ${winnerId} WINS!`;
      document.getElementById('winner-time').textContent = winner.finishTime.toFixed(2);
      document.getElementById('p1-final-time').textContent = player1.finishTime.toFixed(2) + 's';
      document.getElementById('p2-final-time').textContent = player2.finishTime.toFixed(2) + 's';
      document.getElementById('p1-final-hits').textContent = player1.hits;
      document.getElementById('p2-final-hits').textContent = player2.hits;

      document.getElementById('finish-layer').style.display = 'flex';
    }

    // Keyboard controls
    addEventListener('keydown', e => {
      if (e.code === 'ArrowUp') player1.jump();
      if (e.code === 'ArrowRight') player1.accelPressed = true;

      if (e.code === 'KeyW') player2.jump();
      if (e.code === 'KeyD') player2.accelPressed = true;

      if (e.code === 'Escape') resetGame();
    });

    addEventListener('keyup', e => {
      if (e.code === 'ArrowRight') player1.accelPressed = false;
      if (e.code === 'KeyD') player2.accelPressed = false;
    });

    // Event listeners
    document.getElementById('start-btn').addEventListener('click', startGame);
    document.getElementById('retry').addEventListener('click', resetGame);

    // ORPHE CORE setup
    var bles = [new Orphe(0), new Orphe(1)];
    for (let i = 0; i < bles.length; i++) {
      bles[i].setup();
    }

    buildCoreToolkit(document.querySelector('#toolkit_p1'), 'Player 1', 0, 'STEP_ANALYSIS_AND_SENSOR_VALUES');
    buildCoreToolkit(document.querySelector('#toolkit_p2'), 'Player 2', 1, 'STEP_ANALYSIS_AND_SENSOR_VALUES');

    var connectedDevices = 0;
    window.devices = {
      0: { acc: { x: 0, y: 0, z: 0 }, eulers: { pitch: 0, roll: 0, yaw: 0 } },
      1: { acc: { x: 0, y: 0, z: 0 }, eulers: { pitch: 0, roll: 0, yaw: 0 } }
    };

    let basePitch = [null, null];
    let lastAccelTime = [0, 0];
    let lastJumpTime = [0, 0];
    const accelCooldownMs = 250;
    const jumpCooldownMs = 200;

    for (let ble of bles) {
      ble.onConnect = function() {
        connectedDevices++;
        console.log('ORPHE Device ' + this.id + ' connected');

        if (connectedDevices === 2) {
          for (let device of bles) {
            device.begin('STEP_ANALYSIS_AND_SENSOR_VALUES');
            setupDataCallbacks(device);
          }
        }
      };

      ble.onDisconnect = function() {
        connectedDevices--;
        console.log('ORPHE Device ' + this.id + ' disconnected');
      };
    }

    function setupDataCallbacks(ble_device) {
      ble_device.gotConvertedAcc = function(_acc) {
        if (!_acc) return;
        window.devices[this.id].acc = _acc;

        const acc = window.devices[this.id].acc;
        const mag = Math.sqrt(acc.x * acc.x + acc.y * acc.y + acc.z * acc.z);
        const now = performance.now();
        const player = this.id === 0 ? player1 : player2;
        const threshold = this.id === 0 ? window.player1Thresholds.accel : window.player2Thresholds.accel;

        if (!player) return;

        const shouldAccel = mag > threshold;

        if (shouldAccel && (now - lastAccelTime[this.id]) > accelCooldownMs) {
          player.setAccelPressed(true);
          lastAccelTime[this.id] = now;
        } else if (!shouldAccel) {
          player.setAccelPressed(false);
        }
      };

      ble_device.gotEuler = function(_euler) {
        if (!_euler) return;
        window.devices[this.id].eulers = _euler;

        if (basePitch[this.id] === null) {
          basePitch[this.id] = _euler.pitch;
          return;
        }

        const currentPitch = _euler.pitch;
        const now = performance.now();
        const player = this.id === 0 ? player1 : player2;
        const threshold = this.id === 0 ? window.player1Thresholds.pitch : window.player2Thresholds.pitch;

        if (!player) return;

        if (currentPitch < -threshold && (now - lastJumpTime[this.id]) > jumpCooldownMs) {
          player.jump();
          lastJumpTime[this.id] = now;
        }
      };
    }

    // Start game loop
    loop();
    console.log('2D Hurdle Game initialized!');
  </script>
</body>
