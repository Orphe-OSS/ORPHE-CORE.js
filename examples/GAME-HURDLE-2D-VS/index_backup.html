<!DOCTYPE html>
<!--
  This file extends the original 100 m hurdles game with support for the
  ORPHE CORE motion sensor.  The game logic remains unchanged – the
  player still runs down a track, jumps over hurdles and manages
  stamina – but in addition to the keyboard controls you can now
  connect an ORPHE CORE sensor and control the game with your foot
  movements.  You can accelerate by stamping your foot repeatedly and
  jump by lifting your foot sharply.  See the accompanying README for
  further details on how the motion detection works.
-->
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3D 100mハードル走（ORPHE CORE対応）</title>
  <style>
    body { margin: 0; overflow: hidden; font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial; }
    #game-canvas { display: block; }
    #ui { position: absolute; inset: 0; pointer-events: none; color: #fff; text-shadow: 0 2px 8px rgba(0,0,0,.6); }
    .hud { position: absolute; top: 16px; left: 16px; font-weight: 600; font-size: 18px; line-height: 1.5; }
    .hud .row { margin-bottom: 6px; }
    .center { position: absolute; inset: 0; display: grid; place-items: center; }
    .card { pointer-events: auto; background: rgba(0,0,0,.55); padding: 20px 28px; border-radius: 12px; text-align: center; }
    .card h1 { margin: 0 0 8px; font-size: 32px; }
    .card p { margin: 6px 0; font-size: 15px; opacity: .95; }
    .btn { display: inline-block; margin-top: 10px; padding: 10px 16px; border-radius: 10px; background: #fff; color: #000; font-weight: 700; cursor: pointer; }
    .big-timer { position: absolute; bottom: 20px; right: 20px; font-size: 40px; font-weight: 800; }
    /* スタミナバー */
    #staminaWrap { position: absolute; top: 16px; right: 16px; width: 200px; height: 16px; border-radius: 10px; background: rgba(255,255,255,.15); overflow: hidden; }
    #staminaBar { height: 100%; width: 100%; background: linear-gradient(90deg,#7CFC00,#FFD700,#FF4500); transform-origin: left center; }
    #staminaLabel { position:absolute; top: 36px; right: 16px; font-weight: 600; }
    /* ORPHE UI container */
    #orphe-ui { position: absolute; bottom: 16px; left: 16px; pointer-events: auto; z-index: 10; }
  </style>
  <!-- Load the ORPHE CORE library and its dependencies.  These scripts
       provide the Orphe class for BLE communication and a simple UI
       builder (CoreToolkit) for connecting devices.  We use these
       scripts to access raw accelerometer and gyroscope data.  See
       ORPHE CORE API documentation for details【604953328350957†L587-L602】. -->
  <script src="https://cdn.jsdelivr.net/gh/Orphe-OSS/ORPHE-CORE.js/js/float16.min.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/gh/Orphe-OSS/ORPHE-CORE.js/js/quaternion.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/gh/Orphe-OSS/ORPHE-CORE.js/js/ORPHE-CORE.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/gh/Orphe-OSS/ORPHE-CORE.js/js/CoreToolkit.js" crossorigin="anonymous"></script>
  <script type="module">
    import * as THREE from 'https://unpkg.com/three@0.160.0/build/three.module.js';
    window.THREE = THREE;

    // Game constants (unchanged)
    const COURSE_LEN_M = 100;
    const HURDLES = 10;
    const FIRST_HURDLE_M = 13.0;
    const HURDLE_SPACING_M = 8.5;
    const HURDLE_HEIGHT_M = 0.84;
    const HURDLE_TOP_THICK = 0.06;
    const PLAYER_EYE_H = 1.7;
    const JUMP_V0 = 5.0;
    const GRAVITY = 11.5;
    const BASE_SPEED = 7.8;
    const MAX_SPEED = 10.5;
    const SLOWDOWN_FACTOR = 0.40;
    const RECOVER_SEC = 1.0;
    const ACCEL_RATE = 15.0;
    const FRICTION = 8.0;
    const LANE_WIDTH = 1.22 * 2;
    // Stamina parameters
    const STAMINA_MAX = 1.0;
    const STAMINA_USE_PER_SEC = 0.45;
    const STAMINA_REGEN_PER_SEC = 0.30;
    const STAMINA_BLOCK_THRESHOLD = 0.08;
    let stamina = STAMINA_MAX;

    // 3D scene setup (unchanged)
    const scene = new THREE.Scene();
    scene.fog = new THREE.Fog(0x87ceeb, 60, 260);
    const camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.01, 800);
    const renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('game-canvas'), antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(devicePixelRatio);
    renderer.setClearColor(0x87ceeb);
    renderer.shadowMap.enabled = true;
    // Lighting
    const hemi = new THREE.HemisphereLight(0xffffff, 0x668866, 0.55);
    scene.add(hemi);
    const sun = new THREE.DirectionalLight(0xffffff, 0.9);
    sun.position.set(10, 20, 8);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    scene.add(sun);
    // Ground (track)
    const groundGeo = new THREE.PlaneGeometry(LANE_WIDTH * 3, COURSE_LEN_M + 80);
    const groundMat = new THREE.MeshLambertMaterial({ color: 0xd24d57 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.position.z = -COURSE_LEN_M / 2 - 20;
    ground.receiveShadow = true;
    scene.add(ground);
    // Lane lines
    const lineMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
    for (let i = -1; i <= 1; i += 2) {
      const line = new THREE.Mesh(new THREE.PlaneGeometry(0.05, COURSE_LEN_M + 80), lineMat);
      line.rotation.x = -Math.PI / 2;
      line.position.set(i * LANE_WIDTH / 2, 0.002, -COURSE_LEN_M / 2 - 20);
      scene.add(line);
    }
    // Arms (swing)
    const skin = new THREE.MeshLambertMaterial({ color: 0xffd2b8 });
    const rightArm = new THREE.Mesh(new THREE.BoxGeometry(0.20, 0.9, 0.20), skin);
    rightArm.position.set(-0.35, -0.45, -0.8);
    const leftArm = rightArm.clone();
    leftArm.position.x = 0.35;
    camera.add(rightArm, leftArm);
    scene.add(camera);
    // Hurdles
    const hurdles = [];
    const hitMarkers = new Set();
    function makeHurdle(z) {
      const hurdle_group = new THREE.Group();
      const base_material = new THREE.MeshLambertMaterial({ color: 0x8B4513 });
      const bar_material = new THREE.MeshLambertMaterial({ color: 0xDC143C });
      const leg1_vert = new THREE.Mesh(new THREE.BoxGeometry(0.2, 1.5, 0.2), base_material);
      leg1_vert.position.set(-2.5, 0.75, 0);
      const leg1_horz = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 1.0), base_material);
      leg1_horz.position.set(-2.5, 0.1, 0.4);
      const leg2_vert = new THREE.Mesh(new THREE.BoxGeometry(0.2, 1.5, 0.2), base_material);
      leg2_vert.position.set(2.5, 0.75, 0);
      const leg2_horz = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.2, 1.0), base_material);
      leg2_horz.position.set(2.5, 0.1, 0.4);
      const top_bar = new THREE.Mesh(new THREE.BoxGeometry(5.2, 0.2, 0.2), bar_material);
      top_bar.position.set(0, 1.4, 0);
      hurdle_group.add(leg1_vert, leg1_horz, leg2_vert, leg2_horz, top_bar);
      hurdle_group.position.set(0, 0, z);
      hurdle_group.userData = { topY: 1.4, z };
      scene.add(hurdle_group);
      hurdles.push(hurdle_group);
    }
    for (let i = 0; i < HURDLES; i++) {
      const z = -(FIRST_HURDLE_M + i * HURDLE_SPACING_M);
      makeHurdle(z);
    }
    // Distance markers (20 m increments)
    function makeRoadStencil(text, isFinish = false) {
      const W = 512, H = 512;
      const cvs = document.createElement('canvas');
      cvs.width = W; cvs.height = H;
      const ctx = cvs.getContext('2d');
      ctx.clearRect(0, 0, W, H);
      ctx.fillStyle = '#fff';
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      ctx.font = '900 150px system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial';
      if (isFinish) {
        ctx.strokeStyle = '#FFD700';
        ctx.lineWidth = 22;
        ctx.strokeText(text, W / 2, H / 2);
        ctx.fillText(text, W / 2, H / 2);
      } else {
        ctx.strokeStyle = '#000';
        ctx.lineWidth = 18;
        ctx.strokeText(text, W / 2, H / 2);
        ctx.fillText(text, W / 2, H / 2);
      }
      const tex = new THREE.CanvasTexture(cvs);
      tex.anisotropy = 8; tex.needsUpdate = true;
      const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, depthWrite: false });
      const geo = new THREE.PlaneGeometry(2.6, 3.4);
      const mesh = new THREE.Mesh(geo, mat);
      mesh.rotation.x = -Math.PI / 2;
      mesh.position.y = 0.003;
      return mesh;
    }
    for (let d = 20; d <= 100; d += 20) {
      const isFinish = (d === 100);
      const m = makeRoadStencil(`${d}m`, isFinish);
      m.position.set(0, 0.003, -d);
      scene.add(m);
    }
    // Finish line (red/white stripes)
    (() => {
      const cvs = document.createElement('canvas');
      cvs.width = 256; cvs.height = 128;
      const ctx = cvs.getContext('2d');
      for (let i = 0; i < 8; i++) {
        ctx.fillStyle = (i % 2 === 0) ? '#ffffff' : '#ff0000';
        ctx.fillRect(i * 32, 0, 32, 128);
      }
      const tex = new THREE.CanvasTexture(cvs);
      tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.ClampToEdgeWrapping;
      const mat = new THREE.MeshBasicMaterial({ map: tex, transparent: false });
      const geo = new THREE.PlaneGeometry(3.2, 0.5);
      const mesh = new THREE.Mesh(geo, mat);
      mesh.rotation.x = -Math.PI / 2;
      mesh.position.set(0, 0.002, -100.25);
      scene.add(mesh);
    })();
    // Clouds (movement visualisation)
    const clouds = [];
    const cloudMat = new THREE.MeshLambertMaterial({ color: 0xffffff });
    function makeCloud(x, y, z) {
      const g = new THREE.Group();
      for (let i = 0; i < 3 + Math.floor(Math.random() * 3); i++) {
        const s = 1.5 + Math.random() * 2.5;
        const puff = new THREE.Mesh(new THREE.SphereGeometry(s, 12, 10), cloudMat);
        puff.position.set((Math.random() - 0.5) * 3, (Math.random() - 0.5) * 1, 0);
        g.add(puff);
      }
      g.position.set(x, y, z);
      g.scale.set(1.2, 1, 1);
      scene.add(g);
      clouds.push(g);
    }
    for (let i = 0; i < 16; i++) {
      const x = (Math.random() * 2 - 1) * 18;
      const y = 6 + Math.random() * 8;
      const z = -Math.random() * (COURSE_LEN_M + 200);
      makeCloud(x, y, z);
    }
    // WebAudio variables (unchanged)
    let audioCtx = null;
    let stepGain;
    let windGain;
    let nextStepAt = 0;
    function initAudio() {
      if (audioCtx) return;
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      stepGain = audioCtx.createGain();
      stepGain.gain.value = 0.6;
      stepGain.connect(audioCtx.destination);
      const bufferSize = 2 * audioCtx.sampleRate;
      const noiseBuffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
      const n = noiseBuffer.getChannelData(0);
      for (let i = 0; i < bufferSize; i++) n[i] = Math.random() * 2 - 1;
      const noise = audioCtx.createBufferSource();
      noise.buffer = noiseBuffer; noise.loop = true;
      const lp = audioCtx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 1800;
      windGain = audioCtx.createGain(); windGain.gain.value = 0.0;
      noise.connect(lp).connect(windGain).connect(audioCtx.destination);
      noise.start();
      console.assert(stepGain && stepGain.gain, 'stepGain initialized');
      console.assert(windGain && windGain.gain, 'windGain initialized');
    }
    function triggerFootstep(at) {
      if (!audioCtx) return;
      const dur = 0.06;
      const src = audioCtx.createBufferSource();
      const buf = audioCtx.createBuffer(1, Math.floor(dur * audioCtx.sampleRate), audioCtx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / d.length);
      src.buffer = buf;
      const hp = audioCtx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 450;
      const g = audioCtx.createGain(); g.gain.value = 0.0;
      src.connect(hp).connect(g).connect(stepGain);
      const t = at || audioCtx.currentTime;
      g.gain.setValueAtTime(0.0, t);
      g.gain.linearRampToValueAtTime(0.7, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.start(t); src.stop(t + dur);
    }
    function triggerJumpWhoosh() {
      if (!audioCtx) return;
      const src = audioCtx.createBufferSource();
      const dur = 0.22;
      const buf = audioCtx.createBuffer(1, Math.floor(dur * audioCtx.sampleRate), audioCtx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      src.buffer = buf;
      const bp = audioCtx.createBiquadFilter();
      bp.type = 'bandpass';
      bp.frequency.value = 1200;
      bp.Q.value = 0.7;
      const g = audioCtx.createGain();
      g.gain.value = 0.0;
      src.connect(bp).connect(g).connect(audioCtx.destination);
      const t = audioCtx.currentTime;
      try { bp.frequency.linearRampToValueAtTime(1800, t + dur); } catch (e) {}
      g.gain.linearRampToValueAtTime(0.6, t + 0.05);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      src.start(t); src.stop(t + dur + 0.02);
    }
    function playCheer() {
      if (!audioCtx) return;
      const dur = 2.5;
      const noise = audioCtx.createBufferSource();
      const buf = audioCtx.createBuffer(1, Math.floor(dur * audioCtx.sampleRate), audioCtx.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * 0.6;
      noise.buffer = buf;
      const lp = audioCtx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2200;
      const g = audioCtx.createGain(); g.gain.value = 0.0;
      noise.connect(lp).connect(g).connect(audioCtx.destination);
      const tones = [440, 554.37, 659.25].map(freq => {
        const osc = audioCtx.createOscillator(); osc.type = 'triangle'; osc.frequency.value = freq;
        const tg = audioCtx.createGain(); tg.gain.value = 0.0;
        osc.connect(tg).connect(audioCtx.destination);
        return { osc, tg };
      });
      const t = audioCtx.currentTime;
      g.gain.linearRampToValueAtTime(0.9, t + 0.3);
      g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
      noise.start(t); noise.stop(t + dur + 0.1);
      tones.forEach(({ osc, tg }, i) => {
        const dt = t + 0.05 * i;
        osc.start(dt);
        tg.gain.linearRampToValueAtTime(0.15, dt + 0.3);
        tg.gain.exponentialRampToValueAtTime(0.0001, t + dur);
        osc.stop(t + dur + 0.1);
      });
    }
    // Game state
    let state = 'ready';
    let clock = new THREE.Clock();
    let runTime = 0;
    let startEpoch = 0;
    let vz = BASE_SPEED;
    let vy = 0;
    let isGround = true;
    let slowRemain = 0;
    let hits = 0;
    // Pressed states – used for keyboard and ORPHE input
    let accelPressedKeyboard = false;
    let accelPressedOrphe = false;
    // UI elements
    const $start = document.getElementById('start-layer');
    const $finish = document.getElementById('finish-layer');
    const $timer = document.getElementById('timer');
    const $dist = document.getElementById('dist');
    const $hcount = document.getElementById('hcount');
    const $speed = document.getElementById('speed');
    const $final = document.getElementById('final-time');
    const $finalHits = document.getElementById('final-hits');
    const $staminaBar = document.getElementById('staminaBar');
    // Utility for formatting numbers
    function fmt(n, d = 2) { return n.toFixed(d); }
    // Keyboard controls remain available
    addEventListener('keydown', e => {
      if (e.code === 'ArrowUp') jump();
      if (e.code === 'ArrowDown') accelPressedKeyboard = true;
    });
    addEventListener('keyup', e => {
      if (e.code === 'ArrowDown') accelPressedKeyboard = false;
    });
    addEventListener('mousedown', startGame);
    addEventListener('touchstart', (e) => { e.preventDefault(); startGame(); }, { passive: false });
    // Jump routine
    function jump() {
      if (state !== 'running') return;
      if (isGround) { vy = JUMP_V0; isGround = false; triggerJumpWhoosh(); }
    }
    function startGame() {
      if (state !== 'ready') return;
      state = 'running';
      clock.start();
      startEpoch = performance.now();
      if ($start) $start.style.display = 'none';
      initAudio();
    }
    const retryBtn = document.getElementById('retry');
    if (retryBtn) retryBtn.addEventListener('click', () => location.reload());
    // Update loop: integrates ORPHE and keyboard input
    function update(dt) {
      if (state !== 'running') return;
      // Determine whether acceleration key is considered pressed
      const canAccel = (accelPressedKeyboard || accelPressedOrphe) && (stamina > STAMINA_BLOCK_THRESHOLD);
      if (canAccel) {
        stamina -= STAMINA_USE_PER_SEC * dt;
        if (stamina < 0) stamina = 0;
        vz += ACCEL_RATE * dt;
      } else {
        stamina += STAMINA_REGEN_PER_SEC * dt;
        if (stamina > STAMINA_MAX) stamina = STAMINA_MAX;
        if (vz > BASE_SPEED) {
          vz -= FRICTION * dt;
          if (vz < BASE_SPEED) vz = BASE_SPEED;
        }
      }
      if (vz > MAX_SPEED) vz = MAX_SPEED;
      // Recover from slow-down
      if (slowRemain > 0) {
        slowRemain -= dt;
        const t = Math.max(0, slowRemain) / RECOVER_SEC;
        vz = vz * (1 - t) + (vz * SLOWDOWN_FACTOR) * t;
      }
      // Audio: adjust wind noise and schedule footsteps
      if (audioCtx) {
        const targetWind = (canAccel ? 0.12 : 0.02) * (vz / MAX_SPEED);
        windGain.gain.linearRampToValueAtTime(targetWind, audioCtx.currentTime + 0.05);
        const stepRate = 1.4 + 2.6 * (vz / MAX_SPEED);
        const interval = 1 / stepRate;
        const now = audioCtx.currentTime;
        if (now > nextStepAt) nextStepAt = now + 0.01;
        while (nextStepAt < now + 0.1) {
          if (isGround && vz > 3.0) { triggerFootstep(nextStepAt); }
          nextStepAt += interval;
        }
      }
      // Forward motion
      camera.position.z -= vz * dt;
      // Vertical motion
      camera.position.y += vy * dt;
      vy -= GRAVITY * dt;
      if (camera.position.y <= PLAYER_EYE_H) {
        camera.position.y = PLAYER_EYE_H; vy = 0; isGround = true;
      }
      // Arm swing
      const swingAmp = 0.7 * (vz / MAX_SPEED);
      const swing = Math.sin(performance.now() * 0.012) * swingAmp;
      rightArm.rotation.x = swing; leftArm.rotation.x = -swing;
      // Move clouds
      for (const c of clouds) {
        c.position.z += 0.4 * dt * vz;
        if (c.position.z > 5) {
          c.position.z = -(COURSE_LEN_M + 200) - Math.random() * 80;
          c.position.x = (Math.random() * 2 - 1) * 18;
          c.position.y = 6 + Math.random() * 8;
        }
      }
      // Timer and distance display
      runTime = (performance.now() - startEpoch) / 1000;
      const remaining = Math.max(0, COURSE_LEN_M + camera.position.z);
      if ($timer) $timer.textContent = fmt(runTime, 2);
      if ($dist) $dist.textContent = fmt(remaining, 1);
      if ($speed) $speed.textContent = fmt(vz, 1);
      // Stamina bar
      if ($staminaBar) {
        $staminaBar.style.transform = `scaleX(${stamina})`;
        $staminaBar.style.filter = stamina < STAMINA_BLOCK_THRESHOLD ? 'grayscale(1)' : 'none';
      }
      // Hurdle collisions
      for (const h of hurdles) {
        if (hitMarkers.has(h)) continue;
        const dzToBar = Math.abs(camera.position.z - h.userData.z);
        if (dzToBar < 0.35) {
          const lift = camera.position.y - PLAYER_EYE_H;
          const neededLift = 0.35;
          if (lift < neededLift) {
            hits++;
            if ($hcount) $hcount.textContent = hits;
            vz = Math.max(2.5, vz * SLOWDOWN_FACTOR);
            slowRemain = RECOVER_SEC;
            camera.rotation.z = 0.08;
            setTimeout(() => { camera.rotation.z = 0; }, 160);
          }
          hitMarkers.add(h);
        }
      }
      // Finish line
      if (camera.position.z <= -COURSE_LEN_M) {
        state = 'finish';
        if ($final) $final.textContent = fmt(runTime, 2) + ' s';
        if ($finalHits) $finalHits.textContent = String(hits);
        if ($finish) $finish.style.display = 'grid';
        playCheer();
      }
    }
    // Animation loop
    function loop() {
      const dt = clock.getDelta();
      if (state === 'running') update(dt);
      renderer.render(scene, camera);
      requestAnimationFrame(loop);
    }
    // Initialize display values
    if ($hcount) $hcount.textContent = '0';
    if ($speed) $speed.textContent = fmt(0, 1);
    if ($dist) $dist.textContent = fmt(COURSE_LEN_M, 1);
    loop();

    // ---------------------------------------------------------------------------
    // ORPHE CORE integration
    // We create a single Orphe instance and provide a simple GUI button for the
    // player to initiate the BLE connection.  The ORPHE API requires a user
    // gesture (click/tap) to open the device chooser.  Once connected,
    // accelerometer and Euler angle callbacks are assigned to interpret foot
    // movements as game controls.  See the API reference for details on
    // begin(), gotAcc() and gotEuler()【604953328350957†L587-L602】【604953328350957†L720-L744】.

    // Create the Orphe instance.  We only use one sensor (id 0) because a
    // single foot is sufficient to control accelerate and jump.  Should you
    // attach sensors to both feet you could duplicate this logic and combine
    // events.
    const orphe = new Orphe(0);
    let basePitch = null;
    let lastJumpTime = 0;
    const jumpCooldownMs = 700; // minimum interval between jump triggers
    const accThresholdAccel = 1.2; // threshold for acceleration detection (approx. g)
    const pitchThresholdJump = 15; // degrees of upward pitch to trigger jump
    // Build a small UI element to connect ORPHE.  We append a button to the
    // #orphe-ui container defined in the HTML.  When clicked, it calls
    // orphe.setup() and then begins notifications on SENSOR_VALUES.  The
    // callbacks are set up once connected.
    const orpheUI = document.getElementById('orphe-ui');
    const connectBtn = document.createElement('div');
    connectBtn.className = 'btn';
    connectBtn.textContent = 'ORPHE接続';
    connectBtn.style.marginRight = '8px';
    orpheUI.appendChild(connectBtn);
    // Status display
    const statusSpan = document.createElement('span');
    statusSpan.style.marginLeft = '8px';
    statusSpan.style.fontSize = '14px';
    statusSpan.textContent = '未接続';
    orpheUI.appendChild(statusSpan);
    // Handler to interpret acceleration values as accelerate input
    function handleAcc(_acc) {
      const mag = Math.sqrt(_acc.x * _acc.x + _acc.y * _acc.y + _acc.z * _acc.z);
      accelPressedOrphe = (mag > accThresholdAccel);
    }
    // Handler to interpret Euler angles as jump input
    function handleEuler(_euler) {
      if (basePitch === null) {
        basePitch = _euler.pitch;
        return;
      }
      const dp = _euler.pitch - basePitch;
      const now = performance.now();
      if (dp > pitchThresholdJump && (now - lastJumpTime) > jumpCooldownMs) {
        jump();
        lastJumpTime = now;
      }
    }
    // Click handler to connect to ORPHE
    connectBtn.addEventListener('click', async () => {
      connectBtn.textContent = '接続中...';
      statusSpan.textContent = '接続要求中';
      try {
        orphe.setup();
        await orphe.begin('SENSOR_VALUES');
        orphe.gotConvertedAcc = handleAcc;
        orphe.gotEuler = handleEuler;
        statusSpan.textContent = '接続済み';
        connectBtn.style.display = 'none';
      } catch (err) {
        console.error(err);
        connectBtn.textContent = 'ORPHE接続';
        statusSpan.textContent = '接続失敗';
      }
    });
  </script>
</head>
<body>
  <div id="ui">
    <div class="hud">
      <div class="row">距離: <span id="dist">100.0</span> m</div>
      <div class="row">ハードル接触: <span id="hcount">0</span></div>
      <div class="row">速度: <span id="speed">0.0</span> m/s</div>
    </div>
    <div id="staminaWrap"><div id="staminaBar"></div></div>
    <div id="staminaLabel">STAMINA</div>
    <!-- Start overlay with an additional paragraph about ORPHE support -->
    <div class="center" id="start-layer">
      <div class="card">
        <h1>100mハードル走</h1>
        <p>↑キーでジャンプ、↓キーで加速（スタミナ消費）</p>
        <p>ORPHE COREと接続すれば足の動きで操作できます</p>
        <p>クリック / タップでスタート</p>
        <div class="btn">スタート</div>
      </div>
    </div>
    <div class="center" id="finish-layer" style="display:none;">
      <div class="card">
        <h1>FINISH!</h1>
        <p>公式タイム: <b id="final-time">—</b></p>
        <p>ハードル接触: <b id="final-hits">0</b> 回</p>
        <div class="btn" id="retry">もう一度</div>
      </div>
    </div>
    <div class="big-timer" id="timer">0.00</div>
  </div>
  <canvas id="game-canvas"></canvas>
  <!-- ORPHE UI container (button added via script) -->
  <div id="orphe-ui"></div>
</body>
</html>
