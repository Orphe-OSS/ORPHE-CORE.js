<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>ORPHE CORE Shooting Game</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.4.0/p5.js"></script>
    <script src="../../js/ORPHE-CORE.js" crossorigin="anonymous"></script>
  <script src="../../js/BleSharedBridge.js"></script>
  <script src="../../js/CoreToolkit.js" crossorigin="anonymous" type="text/javascript"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.2/dist/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
<script src="../../js/site-analytics.js"></script>
</head>
<body>
    <div style="text-align:center; margin-top:30px;">
        <img src="rogo.png" style="width:180px; margin-bottom:10px;">
        <h1>ORPHE CORE Shooting Game</h1>
        <p>ORPHE COREをコントローラーにして、左右の傾きで自機を動かし、振動でミサイルを発射！<br>
        敵を撃ち落とし、ハイスコアを目指そう！<br>
        ※キーボードの左右矢印や「m」キーでも操作できます。</p>
        <div id="toolkit_placeholder1" class="my-4"></div>
      <div id="ble-support-message" class="alert alert-warning mx-4" style="display:none;">
        Web Bluetooth is disabled in this browser. Open this page in Chrome to connect ORPHE CORE.
      </div>
    </div>
    <div id="p5Canvas" style="display:flex; justify-content:center;"></div>
    <script>
      // CoreToolkit.js creates the shared bles array. Use the same instance in
      // sketch.js so connected sensor callbacks reach the game input.
      var ble = bles[0];
      window.ble = ble;
      ble.setup();
      buildCoreToolkit(
        document.querySelector('#toolkit_placeholder1'),
        '01',
        0,
        'SENSOR_VALUES',
        { forceDeviceSelection: true }
      );
      guardCoreToolkitBluetooth({ coreIds: [0], messageElement: '#ble-support-message' });
    </script>
    <script src="sketch.js"></script>
</body>
</html>
