<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>ORPHE CORE 3D Shooting</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="../../css/custom.css" rel="stylesheet">
    <link href="../../css/orphe_custom.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.3/font/bootstrap-icons.css">
    <link rel="stylesheet" href="styles.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="../../js/ORPHE-CORE.js" crossorigin="anonymous"></script>
    <script src="../../js/CoreToolkit.js" crossorigin="anonymous" type="text/javascript"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            color: white;
            font-family: 'Courier New', Courier, monospace;
        }

        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
            z-index: 10;
        }

        #score {
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 0 #000;
        }

        #instructions {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            pointer-events: none;
            opacity: 0.7;
            z-index: 10;
        }

        #toolkit_placeholder1 {
            position: absolute;
            top: 20px;
            right: 20px;
            pointer-events: auto;
            z-index: 200;
            min-width: 230px;
            padding: 12px 14px;
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.78);
            color: #fff;
            font-size: 18px;
            line-height: 1.4;
        }

        #toolkit_placeholder1 .form-check-input {
            width: 2.6em;
            height: 1.35em;
            cursor: pointer;
        }

        #toolkit_placeholder1 i,
        #toolkit_placeholder1 label {
            font-size: 18px;
        }

        #ble-support-message {
            display: none;
            position: absolute;
            top: 92px;
            right: 20px;
            z-index: 205;
            max-width: 280px;
            padding: 10px 12px;
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.78);
            color: #fff;
            font-size: 13px;
            line-height: 1.5;
        }

        #settings-toggle {
            position: absolute;
            top: 104px;
            right: 20px;
            z-index: 180;
            padding: 10px 14px;
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.72);
            color: #fff;
            cursor: pointer;
        }

        #settings-panel {
            display: none;
            position: absolute;
            top: 154px;
            right: 20px;
            z-index: 180;
            width: 260px;
            padding: 14px;
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 10px;
            background: rgba(0, 0, 0, 0.82);
        }

        #settings-panel.visible {
            display: block;
        }

        .setting-group {
            display: grid;
            gap: 6px;
            margin-bottom: 12px;
        }

        #game-over-screen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        #game-over-screen h1 {
            font-size: 64px;
            margin: 0 0 20px 0;
            color: #ff4444;
            text-transform: uppercase;
            letter-spacing: 5px;
        }

        #final-score {
            font-size: 48px;
            margin-bottom: 40px;
            color: #fff;
        }

        #restart-btn {
            padding: 15px 40px;
            font-size: 24px;
            background: #00AAFF;
            color: white;
            width: 150px;
            cursor: pointer;
        }

        .value-display {
            font-size: 14px;
            color: white;
            margin-top: 2px;
        }
    </style>
<script src="../../js/site-analytics.js"></script>
</head>

<body>
    <div id="ui-container">
        <div id="score">SCORE: 0</div>
    </div>
    <div id="toolkit_placeholder1"></div>
    <div id="ble-support-message">Web Bluetooth is disabled in this browser. Open this page in Chrome to connect ORPHE CORE.</div>
    <div id="instructions">
        <p>ORPHE CORE: Tilt to Move, Tap to Shoot, C to Calibrate | Keyboard: Arrows to Move, Space to Shoot</p>
    </div>

    <button id="settings-toggle">⚙️ SETTINGS</button>
    <div id="settings-panel">
        <div class="setting-group">
            <label>GAME SPEED</label>
            <input type="range" id="speed-slider" min="0.5" max="3.0" step="0.1" value="1.0">
            <span class="value-display" id="speed-val">1.0x</span>
        </div>
        <div class="setting-group">
            <label>PLAYER SENSITIVITY</label>
            <input type="range" id="sens-slider" min="0.5" max="2.0" step="0.1" value="1.0">
            <span class="value-display" id="sens-val">1.0x</span>
        </div>
        <div class="setting-group">
            <label>SPAWN RATE</label>
            <input type="range" id="spawn-slider" min="0.5" max="3.0" step="0.1" value="1.0">
            <span class="value-display" id="spawn-val">1.0x</span>
        </div>
    </div>

    <div id="game-over-screen">
        <h1>GAME OVER</h1>
        <div id="final-score">SCORE: 0</div>
        <button id="restart-btn">RESTART</button>
    </div>

    <script>
        // CoreToolkit.js creates the shared bles array. Use the same instance in
        // main.js so connected sensor callbacks reach the game input.
        var ble = bles[0];
        window.ble = ble;
        ble.setup();
        buildCoreToolkit(document.querySelector('#toolkit_placeholder1'), '01', 0, 'SENSOR_VALUES');
        const isEmbeddedBrowser = /Electron|Codex/i.test(navigator.userAgent);
        const canUseWebBluetooth = window.isSecureContext && navigator.bluetooth && !isEmbeddedBrowser;
        if (!canUseWebBluetooth) {
            const switchBle = document.querySelector('#switch_ble0');
            if (switchBle) {
                switchBle.checked = false;
                switchBle.disabled = true;
                switchBle.title = 'Open this page in Chrome to connect ORPHE CORE.';
            }
            const message = document.querySelector('#ble-support-message');
            if (message) {
                message.style.display = 'block';
            }
        }
    </script>
    <script src="../../js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
    <script src="main.js"></script>
</body>

</html>
