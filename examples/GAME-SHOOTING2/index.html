<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <title>ORPHE CORE 3D Shooting</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/Orphe-OSS/ORPHE-CORE.js@main/js/ORPHE-CORE.js"
        crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/gh/Orphe-OSS/ORPHE-CORE.js/js/CoreToolkit.js" crossorigin="anonymous"
        type="text/javascript"></script>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            color: white;
            font-family: 'Courier New', Courier, monospace;
        }

        #ui-container {
            position: absolute;
            top: 20px;
            left: 20px;
            pointer-events: none;
            z-index: 10;
        }

        #score {
            font-size: 24px;
            font-weight: bold;
            text-shadow: 2px 2px 0 #000;
        }

        #instructions {
            position: absolute;
            bottom: 20px;
            left: 0;
            width: 100%;
            text-align: center;
            pointer-events: none;
            opacity: 0.7;
            z-index: 10;
        }

        #toolkit_placeholder1 {
            position: absolute;
            top: 20px;
            right: 20px;
            pointer-events: auto;
            z-index: 20;
        }

        #game-over-screen {
            display: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.85);
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }

        #game-over-screen h1 {
            font-size: 64px;
            margin: 0 0 20px 0;
            color: #ff4444;
            text-transform: uppercase;
            letter-spacing: 5px;
        }

        #final-score {
            font-size: 48px;
            margin-bottom: 40px;
            color: #fff;
        }

        #restart-btn {
            padding: 15px 40px;
            font-size: 24px;
            background: #00AAFF;
            color: white;
            width: 150px;
            cursor: pointer;
        }

        .value-display {
            font-size: 14px;
            color: white;
            margin-top: 2px;
        }
    </style>
<script src="../../js/site-analytics.js"></script>
</head>

<body>
    <div id="ui-container">
        <div id="score">SCORE: 0</div>
    </div>
    <div id="toolkit_placeholder1"></div>
    <div id="instructions">
        <p>ORPHE CORE: Tilt to Move, Tap to Shoot | Keyboard: Arrows to Move, Space to Shoot</p>
    </div>

    <button id="settings-toggle">⚙️ SETTINGS</button>
    <div id="settings-panel">
        <div class="setting-group">
            <label>GAME SPEED</label>
            <input type="range" id="speed-slider" min="0.5" max="3.0" step="0.1" value="1.0">
            <span class="value-display" id="speed-val">1.0x</span>
        </div>
        <div class="setting-group">
            <label>PLAYER SENSITIVITY</label>
            <input type="range" id="sens-slider" min="0.5" max="2.0" step="0.1" value="1.0">
            <span class="value-display" id="sens-val">1.0x</span>
        </div>
        <div class="setting-group">
            <label>SPAWN RATE</label>
            <input type="range" id="spawn-slider" min="0.5" max="3.0" step="0.1" value="1.0">
            <span class="value-display" id="spawn-val">1.0x</span>
        </div>
    </div>

    <div id="game-over-screen">
        <h1>GAME OVER</h1>
        <div id="final-score">SCORE: 0</div>
        <button id="restart-btn">RESTART</button>
    </div>

    <script>
        // Auto-connect similar to original
        var ble = new Orphe(0);
        ble.setup();
        buildCoreToolkit(document.querySelector('#toolkit_placeholder1'), '01', 0, 'STEP_ANALYSIS_AND_SENSOR_VALUES');
    </script>
    <script src="main.js"></script>
</body>

</html>
