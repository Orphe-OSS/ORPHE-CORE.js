<!doctype html>
<html lang="ja">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Orphe Piano — ORPHE CORE</title>
  <meta name="description"
    content="A browser-based Orphe Piano port that turns ORPHE CORE motion, steps, and kicks into the original sampled piano scene interactions.">
  <link href="../../css/custom.css" rel="stylesheet">
  <link href="../../css/orphe_custom.css" rel="stylesheet">
  <link href="./style.css?v=20260613-arpeggio" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.9.1/font/bootstrap-icons.css">
  <script src="../../js/site-analytics.js"></script>
</head>

<body>
  <main class="piano-app">
    <nav class="topbar" aria-label="ORPHE Piano controls">
      <a class="brand" href="../../">
        <img src="../../images/orphe.svg" alt="ORPHE" height="24">
        <span>Orphe Piano</span>
      </a>
      <div id="toolkit_placeholder" class="toolkit"></div>
    </nav>

    <div id="ble-support-message" class="ble-alert" role="status" style="display:none;">
      Web Bluetooth is disabled in this browser. Open this page in Chrome to connect ORPHE CORE.
    </div>

    <section class="instrument" aria-label="Orphe Piano instrument">
      <canvas id="pianoCanvas" width="1280" height="720"></canvas>

      <aside class="control-panel" aria-label="Piano controls">
        <div>
          <p class="kicker">Motion Instrument</p>
          <h1>Orphe Piano</h1>
        </div>

        <div class="transport">
          <button id="soundToggle" type="button" class="icon-button primary" title="Enable sound">
            <i class="bi bi-volume-up"></i>
            <span>Sound On</span>
          </button>
          <button id="leftTest" type="button" class="icon-button" title="Play left note">
            <i class="bi bi-arrow-left-circle"></i>
            <span>Left</span>
          </button>
          <button id="rightTest" type="button" class="icon-button" title="Play right note">
            <i class="bi bi-arrow-right-circle"></i>
            <span>Right</span>
          </button>
        </div>

        <label class="field">
          <span>Scene</span>
          <select id="sceneSelect">
            <option value="auto">Auto by walking</option>
            <option value="1">Scene 1</option>
            <option value="2">Scene 2</option>
            <option value="3">Scene 3</option>
            <option value="4">Scene 4</option>
            <option value="5">Scene 5</option>
            <option value="6">Scene 6</option>
            <option value="7">Scene 7</option>
            <option value="8">Scene 8</option>
            <option value="9">Scene 9</option>
            <option value="10">Scene 10</option>
          </select>
        </label>

        <label class="field">
          <span>Volume</span>
          <input id="volumeRange" type="range" min="0" max="100" value="78">
        </label>

        <label class="field">
          <span>Sustain</span>
          <input id="sustainRange" type="range" min="20" max="100" value="58">
        </label>

        <label class="field">
          <span>Sensitivity</span>
          <input id="sensitivityRange" type="range" min="20" max="100" value="52">
        </label>

        <div class="foot-readouts" aria-live="polite">
          <section class="scene-readout">
            <div>
              <strong id="sceneReadout">Scene --</strong>
              <span id="sampleStatus">samples not loaded</span>
            </div>
            <div>
              <strong id="stepReadout">0</strong>
              <span>Progress</span>
            </div>
            <div class="scene-meter" aria-label="Scene progress">
              <div class="scene-meter-track">
                <span id="sceneMeterFill"></span>
              </div>
              <div class="scene-meter-copy">
                <span id="sceneMeterLabel">0/5 to Scene 2</span>
                <span id="sceneDecayStatus">idle</span>
              </div>
            </div>
          </section>
          <section class="foot-readout" id="readout0">
            <div class="side-chip left">L</div>
            <div>
              <strong id="note0">--</strong>
              <span id="motion0">waiting</span>
            </div>
          </section>
          <section class="foot-readout" id="readout1">
            <div class="side-chip right">R</div>
            <div>
              <strong id="note1">--</strong>
              <span id="motion1">waiting</span>
            </div>
          </section>
        </div>
      </aside>
    </section>

    <section class="keyboard-strip" aria-label="Current notes">
      <div id="keyboardNotes"></div>
    </section>
  </main>

  <script src="../../js/ORPHE-CORE.js?v=20260612-ble" crossorigin="anonymous"></script>
  <script src="../../js/BleSharedBridge.js"></script>
  <script src="../../js/float16.min.js" crossorigin="anonymous" type="text/javascript"></script>
  <script src="../../js/quaternion.js" crossorigin="anonymous" type="text/javascript"></script>
  <script src="../../js/CoreToolkit.js?v=20260612-ble"></script>
  <script src="./sketch.js?v=20260613-arpeggio"></script>
</body>

</html>
