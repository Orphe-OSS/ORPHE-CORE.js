<body>
    <h1>Hello, CoreToolkit.js</h1>

      Web Bluetooth is disabled in this browser. Open this page in Chrome to connect ORPHE CORE.

    <script src="https://cdn.jsdelivr.net/gh/Orphe-OSS/ORPHE-CORE.js@v1.4.1/js/ORPHE-CORE.js" crossorigin="anonymous"></script>

    <script>
        function dft(input) {
            const n = input.length;
            const output = [];
            for (let k = 0; k < n; k++) {
                let sumReal = 0;
                let sumImag = 0;
                for (let t = 0; t < n; t++) {
                    const angle = (2 * Math.PI * k * t) / n;
                    sumReal += input[t] * Math.cos(angle);
                    sumImag -= input[t] * Math.sin(angle);
                }
                output.push(Math.sqrt(sumReal * sumReal + sumImag * sumImag));
            }
            return output;
        }

        var powers = [];
        window.onload = function () {
            // ORPHE CORE Init; bles[0] and bles[1] are used by CoreToolkit.js
            bles[0].setup();
            buildCoreToolkit(document.querySelector('#toolkit_placeholder'), '01', 0, 'SENSOR_VALUES');
            guardCoreToolkitBluetooth({ coreIds: [0], messageElement: '#ble-support-message' });
            // alternative begin function call
            // buildCoreToolkit(document.querySelector('#toolkit_placeholder'),
            //     '01', // name to be shown on the UI
            //     0, // index of bles array
            //     'STEP_ANALYSIS', // STEP_ANALYSIS, SENSOR_VALUES, STEP_ANALYSIS_AND_SENSOR_VALUES
            //     { range: { acc: 8, gyro: 1000 } } // sensor range
            // );

            bles[0].gotAcc = function (acc) {
                acc_x.push(acc.x);
                while (acc_x.length > 400) {
                    acc_x.shift();
                    powers = dft(acc_x);

                }
            }
        }


        function generateSineWave(amplitude, frequency, samplingFrequency, duration) {
            let sineWave = [];
            for (let i = 0; i < duration * samplingFrequency; i++) {
                let t = i / samplingFrequency;
                sineWave.push(amplitude * Math.sin(2 * Math.PI * frequency * t));
            }
            return sineWave;
        }

        let duration = 2;
        let samplingFrequency = 200;
        let frequency = 1.0;
        let sineWave = generateSineWave(1.0, frequency, samplingFrequency, duration);

        var acc_x = [];


        function setup() {
            createCanvas(400, 400);
        }

        function draw() {
            background(220);

            if (acc_x.length == 400) {
                stroke(0);
                noFill();
                beginShape();
                for (let i = 0; i < duration * samplingFrequency; i++) {
                    vertex(i, height / 2 + acc_x[i] * 100);
                }
                endShape();

                let sum = new Array(10).fill(0);
                stroke(0, 0, 255);
                for (let j = 0; j < 10; j++) {
                    beginShape();
                    for (let i = 0; i < duration * samplingFrequency; i++) {
                        let t = i / samplingFrequency;
                        let result = acc_x[i] * Math.sin(2 * Math.PI * (j + 1) * t);
                        //vertex(i, height / 2 + 100 * Math.sin(2 * Math.PI * (j + 1) * t))
                        sum[j] += result;
                    }
                    endShape();
                }

                stroke(255, 0, 0);
                beginShape();
                for (let j = 0; j < 10; j++) {
                    vertex(j * 40, height / 2 - sum[j] * sum[j] * 0.01);
                }
                endShape();

                stroke(0, 200, 0);
                beginShape();
                for (let j = 0; j < powers.length / 2; j++) {
                    vertex(j * 2, height / 2 - powers[j]);
                }
                endShape();

            }
        }

    </script>
