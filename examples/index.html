<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Examples一覧 - ORPHE-CORE.js</title>
  <link rel="stylesheet" href="../css/custom.css">
  <style>
    :root {
      color-scheme: dark;
      --bg: #151515;
      --panel: #202020;
      --panel-soft: #2a2a2a;
      --text: #f5f5f5;
      --muted: #b9b9b9;
      --line: #3a3a3a;
      --accent: #35d6df;
    }

    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    main {
      width: min(1180px, calc(100% - 32px));
      margin: 0 auto;
      padding: 48px 0 72px;
    }

    a {
      color: inherit;
    }

    .page-header {
      display: grid;
      gap: 16px;
      margin-bottom: 32px;
    }

    .eyebrow {
      color: var(--accent);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    h1 {
      max-width: 820px;
      margin: 0;
      font-size: clamp(34px, 5vw, 64px);
      line-height: 1.08;
      letter-spacing: 0;
    }

    .lead {
      max-width: 760px;
      margin: 0;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.7;
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 28px 0 36px;
      padding: 16px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
    }

    .toolbar label {
      display: grid;
      gap: 6px;
      min-width: min(260px, 100%);
      color: var(--muted);
      font-size: 13px;
    }

    .toolbar select,
    .toolbar input {
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: #111;
      color: var(--text);
      font: inherit;
      padding: 0 12px;
    }

    .stats {
      color: var(--muted);
      margin-bottom: 24px;
      font-size: 14px;
    }

    .category {
      margin-top: 40px;
    }

    .category h2 {
      margin: 0 0 18px;
      font-size: 24px;
      letter-spacing: 0;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 18px;
    }

    .card {
      display: grid;
      grid-template-rows: auto 1fr;
      min-height: 100%;
      overflow: hidden;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      text-decoration: none;
    }

    .thumb {
      display: grid;
      place-items: center;
      aspect-ratio: 16 / 9;
      background: var(--panel-soft);
      color: var(--muted);
      font-size: 13px;
      text-align: center;
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .card-body {
      display: grid;
      gap: 12px;
      padding: 16px;
    }

    .card h3 {
      margin: 0;
      font-size: 18px;
      letter-spacing: 0;
    }

    .card p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    .pill {
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 4px 8px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1;
    }

    .empty,
    .error {
      padding: 24px;
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main>
    <header class="page-header">
      <div class="eyebrow">ORPHE-CORE.js Examples</div>
      <h1>ORPHE COREで作れるものを探す。</h1>
      <p class="lead">接続やLED制御から、センサー値の取得、Gait Analysis、記録・解析、ゲーム、クリエイティブ表現まで、目的に合わせてExampleを選べます。</p>
    </header>

    <section class="toolbar" aria-label="Example filters">
      <label>
        カテゴリー
        <select id="categoryFilter">
          <option value="">すべてのカテゴリー</option>
        </select>
      </label>
      <label>
        難易度
        <select id="difficultyFilter">
          <option value="">すべてのレベル</option>
        </select>
      </label>
      <label>
        検索
        <input id="searchFilter" type="search" placeholder="タイトル・トピック・データで検索">
      </label>
    </section>

    <div id="stats" class="stats"></div>
    <div id="gallery"></div>
  </main>

  <script src="gallery.js"></script>
</body>
</html>
