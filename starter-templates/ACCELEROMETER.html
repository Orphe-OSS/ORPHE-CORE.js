<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>orphe.js</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.3/font/bootstrap-icons.css">
</head>

<body>
    <h1>ACCELEROMETER</h1>
    <button onclick="ble.begin('SENSOR_VALUES');">connect</button>
    <br>
    <ul>
        <li id="x"></li>
        <li id="y"></li>
        <li id="z"></li>
    </ul>


    <!-- <script src="https://cdn.jsdelivr.net/gh/Orphe-OSS/ORPHE-CORE.js@main/js/ORPHE-CORE.js" crossorigin="anonymous"
        type="text/javascript"></script> -->
    <script src="../js/ORPHE-CORE.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/Orphe-OSS/ORPHE-CORE.js@main/js/float16.min.js" crossorigin="anonymous"
        type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/gh/Orphe-OSS/ORPHE-CORE.js@main/js/quaternion.js" crossorigin="anonymous"
        type="text/javascript"></script>
    <script>
        var ble = new Orphe(0);
        window.onload = function () {
            // ORPHE CORE Init
            ble.setup();
            // gotConvertedAcc は実 G 値 (range 設定に応じて ±2/±4/±8/±16 G) を返す。
            // 「ACCELEROMETER」というファイル名から学習者が期待する「加速度センサ
            // の生データ」に近いのは正規化値ではなく実 G 値なのでこちらを使う。
            // 正規化値 (-1〜1) が欲しい場合は ble.gotAcc を直接上書きする。
            ble.gotConvertedAcc = function (acc) {
                document.querySelector('#x').innerHTML = acc.x;
                document.querySelector('#y').innerHTML = acc.y;
                document.querySelector('#z').innerHTML = acc.z;
            }
        }
    </script>
</body>

</html>
