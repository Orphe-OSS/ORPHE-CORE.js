<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <title>Stride Starter — ORPHE CORE</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.3/font/bootstrap-icons.css">
</head>

<body>
    <h1>STRIDE</h1>
    <button onclick="ble.begin('STEP_ANALYSIS');">connect</button>
    <br>
    <ul>
        <li id="x"></li>
        <li id="y"></li>
        <li id="z"></li>
    </ul>
    <script src="../js/ORPHE-CORE.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/Orphe-OSS/ORPHE-CORE.js@v1.4.0/js/float16.min.js" crossorigin="anonymous"
        type="text/javascript"></script>
    <script src="https://cdn.jsdelivr.net/gh/Orphe-OSS/ORPHE-CORE.js@v1.4.0/js/quaternion.js" crossorigin="anonymous"
        type="text/javascript"></script>
    <script>
        var ble = new Orphe(0);
        window.onload = function () {
            // ORPHE CORE Init
            ble.setup();
            ble.gotStride = function (stride) {
                document.querySelector('#x').innerHTML = stride.x;
                document.querySelector('#y').innerHTML = stride.y;
                document.querySelector('#z').innerHTML = stride.z;
                console.log(stride);
            }

        }
    </script>
</body>

</html>
