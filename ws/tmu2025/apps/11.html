<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ORPHE CORE Sword Visualization</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #000;
            color: white;
            font-family: sans-serif;
        }

        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 100;
        }

        button {
            padding: 10px 20px;
            font-size: 16px;
            cursor: pointer;
            background: #222;
            color: white;
            border: 1px solid #fff;
            border-radius: 5px;
        }

        button:hover {
            background: #444;
        }

        #data-display {
            margin-top: 10px;
            font-size: 14px;
        }
    </style>
    <script src="src/ORPHE-CORE.js"></script>
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.150.1/build/three.module.js"
            }
        }
    </script>
</head>

<body>
    <div id="ui">
        <button id="connect-button">ORPHE CORE に接続</button>
        <div id="data-display">
            Pitch: <span id="pitch-val">0</span>° | 
            Roll: <span id="roll-val">0</span>° | 
            Yaw: <span id="yaw-val">0</span>°<br>
            <small>更新回数: <span id="count-val">0</span></small>
        </div>
        <div id="score-display" style="font-size: 24px; font-weight: bold; color: #ffeb3b; margin-top: 10px;">
            SCORE: <span id="score-val">0</span>
        </div>
        <button id="reset-button" style="margin-top: 5px; font-size: 14px; padding: 8px 15px; background: #c62828;">現在の向きを「正解」として記録</button>
        <p id="status-msg" style="font-size: 12px; color: #aaa; margin-top: 5px;">1. 接続後、2. 剣を真っ直ぐ構えて、3. ボタンを押して開始</p>
    </div>

    <script type="module">
        import * as THREE from 'three';

        let ble = new Orphe(0);
        let scene, camera, renderer, swordGroup, targetMesh;
        let score = 0;
        let updateCount = 0;
        let baseQuaternion = new THREE.Quaternion();

        // 剣の先端の座標を計算するためのヘルパー
        const bladeTip = new THREE.Vector3(0, 3, 0); // 剣の長さが3なので y=3 が先端
        const tempVector = new THREE.Vector3();

        // 初期化
        window.onload = () => {
            ble.setup();
            initThree();
            spawnTarget();
        };

        function spawnTarget() {
            if (!targetMesh) return;
            // ずっと画面中心（前方）に配置
            targetMesh.position.set(0, 1.5, -2);
            targetMesh.visible = true;
        }

        function checkCollision() {
            if (!swordGroup || !targetMesh || !targetMesh.visible) return;

            // 剣の先端の世界座標を取得
            tempVector.copy(bladeTip);
            swordGroup.localToWorld(tempVector);

            // ターゲットとの距離をチェック
            const distance = tempVector.distanceTo(targetMesh.position);

            if (distance < 0.6) { // 当たり判定のしきい値
                score += 100;
                document.getElementById('score-val').innerText = score;
                targetMesh.visible = false;
                
                // ヒット演出後、再び同じ場所（中心）に出現させる
                setTimeout(spawnTarget, 500); 
            }
        }

        document.getElementById('connect-button').onclick = async () => {
            try {
                // STEP_ANALYSIS_AND_SENSOR_VALUES に変更して、より確実にデータを取得
                await ble.begin('SENSOR_VALUES');
                document.getElementById('connect-button').innerText = "接続済み";
            } catch (e) {
                console.error(e);
                alert("接続に失敗しました。Bluetoothが有効か、他で接続されていないか確認してください。");
            }
        };

        document.getElementById('reset-button').onclick = () => {
            if (lastQuat) {
                baseQuaternion.copy(lastQuat).invert();
                document.getElementById('status-msg').innerText = "✅ 正解の角度を記録しました！";
                document.getElementById('status-msg').style.color = "#44ff44";
                setTimeout(() => {
                    document.getElementById('status-msg').innerText = "ターゲットを斬ってください！";
                    document.getElementById('status-msg').style.color = "#aaa";
                }, 2000);
            }
        };

        let lastQuat = new THREE.Quaternion();

        // 姿勢データの取得
        ble.gotQuat = (quat) => {
            updateCount++;
            document.getElementById('count-val').innerText = updateCount;

            if (swordGroup) {
                // ORPHE CORE のクォータニオンを Three.js の形式に
                lastQuat.set(quat.x, quat.y, quat.z, quat.w);
                
                // 正面リセットを反映したクォータニオン
                let deltaQuat = new THREE.Quaternion().multiplyQuaternions(baseQuaternion, lastQuat);
                
                // センサの生のオイラー角を取得
                let sensorEuler = new THREE.Euler().setFromQuaternion(deltaQuat, 'YXZ');
                
                // 全ての動く向きを逆にするために符号を反転させる (- を付ける)
                const multiplier = -2.5;
                const yawMultiplier = 18.0; // Yawの向きを反転 (-18.0 -> 18.0)
                
                // 軸のマッピングを入れ替え: センサのYaw(y)を剣のPitch(x:縦振り)へ
                let targetPitch = sensorEuler.y * yawMultiplier;
                let targetYaw = sensorEuler.x * multiplier;
                let targetRoll = sensorEuler.z * multiplier;
                
                // 入れ替えた角度を再適用
                swordGroup.quaternion.setFromEuler(new THREE.Euler(targetPitch, targetYaw, targetRoll, 'YXZ'));
                
                // 持ち手に合わせた補正（コアを水平に持ったときに剣が垂直に立つように）
                swordGroup.rotateX(Math.PI / 2);
            }
        };



        ble.gotEuler = (euler) => {
            // ORPHE-CORE.js の euler はラジアンで返ってくるため、度数法に変換
            const toDeg = 180 / Math.PI;
            
            // 値が非常に小さい（0.2など）場合、ラジアンのまま表示されている可能性があります
            // ここで度数法に変換して表示します
            let p = euler.pitch * toDeg;
            let r = euler.roll * toDeg;
            let y = euler.yaw * toDeg;

            // もし変換しても値が小さすぎる場合、元の値が非常に小さい可能性があります
            // デバッグ用に console にも出力します
            if (updateCount % 20 === 0) {
                console.log("Raw Euler:", euler);
                console.log("Degree Euler:", {p, r, y});
            }

            document.getElementById('pitch-val').innerText = p.toFixed(1);
            document.getElementById('roll-val').innerText = r.toFixed(1);
            document.getElementById('yaw-val').innerText = y.toFixed(1);
        };

        // 角速度データの取得
        ble.gotConvertedGyro = (gyro) => {
            // グラフ削除に伴い、データの蓄積と描画処理を削除しました
        };


        function initThree() {
            // Scene
            scene = new THREE.Scene();

            // Camera
            camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
            camera.position.z = 5;
            camera.position.y = 1;

            // Renderer
            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            document.body.appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0x404040);
            scene.add(ambientLight);
            const directionalLight = new THREE.DirectionalLight(0xffffff, 1);
            directionalLight.position.set(1, 1, 1).normalize();
            scene.add(directionalLight);

            // Sword Group
            swordGroup = new THREE.Group();
            scene.add(swordGroup);

            // Blade
            const bladeGeometry = new THREE.BoxGeometry(0.2, 3, 0.05);
            const bladeMaterial = new THREE.MeshStandardMaterial({ color: 0xcccccc, metalness: 0.8, roughness: 0.2 });
            const blade = new THREE.Mesh(bladeGeometry, bladeMaterial);
            blade.position.y = 1.5; // グループの中心を柄の付け根にするためのオフセット
            swordGroup.add(blade);

            // Hilt (柄)
            const hiltGeometry = new THREE.CylinderGeometry(0.08, 0.08, 0.8, 16);
            const hiltMaterial = new THREE.MeshStandardMaterial({ color: 0x663300 });
            const hilt = new THREE.Mesh(hiltGeometry, hiltMaterial);
            hilt.position.y = -0.4;
            swordGroup.add(hilt);

            // Crossguard (鍔)
            const guardGeometry = new THREE.BoxGeometry(0.8, 0.1, 0.2);
            const guardMaterial = new THREE.MeshStandardMaterial({ color: 0x999900 });
            const guard = new THREE.Mesh(guardGeometry, guardMaterial);
            guard.position.y = 0;
            swordGroup.add(guard);

            // Grid Helper
            const grid = new THREE.GridHelper(20, 20, 0x444444, 0x222222);
            grid.position.y = -2;
            scene.add(grid);

            // Target (Glowing Sphere)
            const targetGeo = new THREE.SphereGeometry(0.3, 32, 32);
            const targetMat = new THREE.MeshStandardMaterial({ 
                color: 0xff0000, 
                emissive: 0xff0000, 
                emissiveIntensity: 0.5,
                transparent: true,
                opacity: 0.8
            });
            targetMesh = new THREE.Mesh(targetGeo, targetMat);
            scene.add(targetMesh);

            animate();
        }

        function animate() {
            requestAnimationFrame(animate);
            checkCollision(); // 当たり判定を毎フレーム実行
            
            // ターゲットをふわふわ浮かせる
            if (targetMesh && targetMesh.visible) {
                targetMesh.position.y += Math.sin(Date.now() * 0.005) * 0.002;
            }
            
            renderer.render(scene, camera);
        }

        window.onresize = () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        };
    </script>
</body>

</html>
