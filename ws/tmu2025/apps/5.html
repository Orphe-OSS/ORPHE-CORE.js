<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>ORPHE 刀剣リズム - 剣で切るトレーニング</title>
  <style>
    :root{--bg:#071021;--panel:#0f1722;--accent:#ff6b6b;--accent-2:#ff8b6b;--good:#6be3ff;--perfect:#ffd86b}
    html,body{height:100%;margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto;background:var(--bg);color:#fff}
    #ui{position:fixed;left:18px;top:18px;z-index:60;display:flex;flex-direction:column;gap:12px;max-width:320px}
    .panel{background:linear-gradient(180deg, rgba(255,255,255,0.02), rgba(255,255,255,0.015));padding:14px;border-radius:12px;backdrop-filter:blur(6px);box-shadow:0 8px 30px rgba(4,6,10,0.6);border:1px solid rgba(255,255,255,0.03)}
    .btn{padding:10px 14px;border-radius:10px;border:none;background:linear-gradient(180deg,var(--accent),var(--accent-2));color:#111;font-weight:800;cursor:pointer;transition:transform 140ms ease, box-shadow 140ms ease, opacity 160ms;box-shadow:0 6px 18px rgba(255,107,107,0.12)}
    .btn:active{transform:translateY(1px) scale(0.998)}
    .btn:hover{transform:translateY(-3px);box-shadow:0 12px 30px rgba(255,107,107,0.16)}
    .btn.secondary{background:#333;color:#fff;box-shadow:0 6px 18px rgba(0,0,0,0.4)}
    .row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
    label{font-size:13px;color:#ddd}
    #c{display:block;width:100%;height:100%;border-radius:4px}
    /* game over modal */
    .game-over{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%) scale(0.98);min-width:320px;max-width:560px;padding:22px;border-radius:14px;background:linear-gradient(180deg, rgba(10,10,12,0.98), rgba(8,8,10,0.96));box-shadow:0 30px 80px rgba(0,0,0,0.7);border:1px solid rgba(255,255,255,0.04);text-align:center;z-index:120;opacity:0;transition:opacity 200ms ease, transform 220ms cubic-bezier(.2,.9,.2,1)}
    .game-over.show{opacity:1;transform:translate(-50%,-50%) scale(1)}
    .game-over h2{margin:0 0 8px 0;font-size:28px}
    .game-over .sub{color:#ddd;margin-bottom:12px}
    .game-over .score{font-size:18px;margin-bottom:14px}
    .game-over .controls{display:flex;gap:10px;justify-content:center}
    #message{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none;text-align:center}
    /* toasts */
    .toast{background:rgba(0,0,0,0.75);color:#fff;padding:8px 12px;border-radius:8px;margin-top:8px;box-shadow:0 6px 16px rgba(0,0,0,0.6);pointer-events:auto;}
    .toast.small{background:rgba(255,255,255,0.06);color:#fff;border:1px solid rgba(255,255,255,0.04)}
    .row{display:flex;gap:8px;align-items:center}
    label{font-size:13px;color:#ddd}
    .stat{font-size:14px}
    #message{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);pointer-events:none;text-align:center}
  </style>
</head>
<body>
  <div id="ui">
    <div class="panel">
      <div class="row" style="gap:10px;margin-bottom:8px">
        <button id="connect" class="btn">ORPHE に接続</button>
        <button id="start" class="btn primary">ゲーム開始</button>
        <button id="stop" class="btn secondary" style="display:none">停止</button>
        <label style="margin-left:auto;font-size:13px;color:#ddd;display:flex;align-items:center;gap:8px"><input id="advToggle" type="checkbox"> 詳細表示</label>
      </div>
      <div id="advancedControls">
      <div class="row">
        <label>BPM <input id="bpm" type="range" min="60" max="160" value="100"> <span id="bpmVal">100</span></label>
      </div>
      <div class="row" style="margin-top:6px">
        <label>出現頻度 <input id="spawnRate" type="range" min="0.2" max="1.0" step="0.05" value="0.45"> <span id="spawnRateVal">0.45</span></label>
      </div>
      <div class="row" style="margin-top:6px">
        <label>角速度閾値 (mag) <input id="sens" type="range" min="0.2" max="8" step="0.1" value="0.8"> <span id="sensVal">0.8</span></label>
        <label>判定(Perfectms) <input id="pw" type="range" min="30" max="160" step="2" value="80"> <span id="pwVal">80</span></label>
      </div> 
      <div class="row" style="margin-top:6px;gap:8px;align-items:center">
        <label>加速度併用 <input id="useAcc" type="checkbox"> </label>
        <label>加速度閾値 (g) <input id="accThr" type="range" min="0.1" max="2.5" step="0.05" value="0.5"> <span id="accThrVal">0.5</span></label>
        <label>加速度スムージング <input id="accSmooth" type="range" min="0" max="0.9" step="0.01" value="0.86"> <span id="accSmoothVal">0.86</span></label>
        <button id="calibrate" style="margin-left:6px;background:#1f6feb;color:#fff;padding:6px;border-radius:6px">オートキャリブレート</button>
      </div>
      <div class="row" style="margin-top:6px;gap:10px;align-items:center">
        <label><input id="debugToggle" type="checkbox"> デバッグ: センサ可視化</label>
        <label style="margin-left:8px"><input id="notifyToggle" type="checkbox"> 検知通知</label>
        <button id="swingTest" style="background:#444;color:#fff;padding:6px 8px;border-radius:6px">振りテスト</button>
      </div>
      </div> <!-- /advancedControls -->
      <div id="status" class="stat">ステータス: 未接続（スペース / タップ / 振りで判定）</div>
      <div id="score" class="stat">スコア: 0</div>
      <div id="hp" class="stat">HP: 5</div>
      <div id="combo" class="stat">コンボ: 0</div>
      <div id="debugPanel" style="display:none;margin-top:8px;font-size:12px;color:#ccc">
        <div>Gyro X: <span id="gx">0</span> Y: <span id="gy">0</span> Z: <span id="gz">0</span></div>
        <div>Gyro Peak: <span id="gpeak">0</span></div>
        <div style="margin-top:6px">Acc X: <span id="ax">0</span> Y: <span id="ay">0</span> Z: <span id="az">0</span></div>
        <div>Acc Peak: <span id="apeak">0</span></div>
        <div style="margin-top:6px">検知ログ: <button id="clearLog" style="background:#333;color:#fff;border-radius:6px;padding:2px 6px;margin-left:6px">クリア</button></div>
        <ul id="swingLog" style="max-height:80px;overflow:auto;padding-left:16px;margin-top:6px"></ul>
      </div>
      <div id="toasts" style="position:fixed;right:12px;top:12px;z-index:9999;pointer-events:none"></div> <!-- transient notifications -->
    </div>
  </div>

  <canvas id="c"></canvas>
  <div id="message"></div>
  <!-- Game Over modal -->
  <div id="gameOver" class="panel game-over" style="display:none">
    <h2>敗北</h2>
    <div class="sub">残念！しかし次はもっと強くなれる。</div>
    <div class="score">スコア: <span id="goScore">0</span></div>
    <div class="controls">
      <button id="goRestart" class="btn">リトライ</button>
      <button id="goClose" class="btn secondary">閉じる</button>
    </div>
  </div>

  <script src="src/ORPHE-CORE.js"></script>
  <script>
    // ---- 基本設定 ----
    const canvas = document.getElementById('c');
    const ctx = canvas.getContext('2d');
    let W = canvas.width = innerWidth;
    let H = canvas.height = innerHeight;
    addEventListener('resize',()=>{W=canvas.width=innerWidth;H=canvas.height=innerHeight; setTimeout(()=>initBackground && initBackground(), 0);});
    // initialize background asynchronously (avoid TDZ on initial script run)
    setTimeout(()=>initBackground && initBackground(), 0);

    // UI elements
    const connectBtn = document.getElementById('connect');
    const startBtn = document.getElementById('start');
    const stopBtn = document.getElementById('stop');
    const bpmEl = document.getElementById('bpm');
    const bpmVal = document.getElementById('bpmVal');
    const sensEl = document.getElementById('sens');
    const sensVal = document.getElementById('sensVal');
    const status = document.getElementById('status');
    const scoreEl = document.getElementById('score');
    const comboEl = document.getElementById('combo');
    const pwEl = document.getElementById('pw');
    const pwVal = document.getElementById('pwVal');
    const message = document.getElementById('message');

    bpmEl.addEventListener('input',()=>bpmVal.innerText=bpmEl.value);
    sensEl.addEventListener('input',()=>sensVal.innerText=sensEl.value);
    pwEl.addEventListener('input',()=>pwVal.innerText=pwEl.value);

    // Audio
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playTone(freq, time=0.06, type='sine'){ const o=audioCtx.createOscillator(); const g=audioCtx.createGain(); o.type=type; o.frequency.value=freq; g.gain.value=0.0001; o.connect(g); g.connect(audioCtx.destination); g.gain.exponentialRampToValueAtTime(0.2,audioCtx.currentTime+0.01); g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+time); o.start(); setTimeout(()=>o.stop(), (time+0.02)*1000); }
    function playHit(kind){ if(kind==='miss'){ playTone(200,0.06,'sine'); } else { playTone(280,0.06,'triangle'); } }
    function playSwoosh(){ // short filtered noise as swing whoosh
      const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * 0.14, audioCtx.sampleRate); const d = buf.getChannelData(0); for(let i=0;i<d.length;i++){ d[i] = (Math.random()*2-1) * (1 - i/d.length) * 0.55; }
      const src = audioCtx.createBufferSource(); src.buffer = buf; const filter = audioCtx.createBiquadFilter(); filter.type='bandpass'; filter.frequency.value = 900 + Math.random()*900; const g = audioCtx.createGain(); g.gain.value = 0.0001; src.connect(filter); filter.connect(g); g.connect(audioCtx.destination); g.gain.exponentialRampToValueAtTime(0.18, audioCtx.currentTime+0.005); g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime+0.14); src.start(); setTimeout(()=>src.stop(), 200);
    }
    function playImpact(kind){ if(kind==='perfect'){ playTone(1200,0.08,'sawtooth'); const o = audioCtx.createOscillator(); const g = audioCtx.createGain(); o.type='square'; o.frequency.value = 220; o.connect(g); g.connect(audioCtx.destination); g.gain.value = 0.0001; g.gain.exponentialRampToValueAtTime(0.28,audioCtx.currentTime+0.01); g.gain.exponentialRampToValueAtTime(0.0001,audioCtx.currentTime+0.28); o.start(); setTimeout(()=>o.stop(), 320); } else { playTone(520,0.06,'triangle'); } }

    // ORPHE セットアップ
    const ble = new Orphe(0);
    ble.setup();
    let orpheConnected = false;
    let rawGyro = {x:0,y:0,z:0};

    // Debug visualization controls
    const debugToggle = document.getElementById('debugToggle');
    const debugPanel = document.getElementById('debugPanel');
    const gxEl = document.getElementById('gx');
    const gyEl = document.getElementById('gy');
    const gzEl = document.getElementById('gz');
    const gpeakEl = document.getElementById('gpeak');
    const axEl = document.getElementById('ax');
    const ayEl = document.getElementById('ay');
    const azEl = document.getElementById('az');
    const apeakEl = document.getElementById('apeak');
    let debugEnabled = false;
    let gyroHistory = new Array(160).fill(0);
    let gyroCurrMag = 0;
    let rawAcc = {x:0,y:0,z:0};
    let accPeak = 0; let accHistory = new Array(160).fill(0); let accCurrMag = 0;
    debugToggle && debugToggle.addEventListener('change', ()=>{ debugEnabled = debugToggle.checked; debugPanel.style.display = debugEnabled ? 'block' : 'none'; });

    // acc UI bindings
    const useAcc = document.getElementById('useAcc');
    const accThrEl = document.getElementById('accThr');
    const accThrVal = document.getElementById('accThrVal');
    const accSmoothEl = document.getElementById('accSmooth');
    const accSmoothVal = document.getElementById('accSmoothVal');
    const calibrateBtn = document.getElementById('calibrate');
    accThrEl && accThrEl.addEventListener('input', ()=> accThrVal.innerText = accThrEl.value);
    accSmoothEl && accSmoothEl.addEventListener('input', ()=> accSmoothVal.innerText = accSmoothEl.value);

    // sens as float
    sensEl && sensEl.addEventListener('input',()=>{ sensVal.innerText = parseFloat(sensEl.value).toFixed(1); });
    sensVal.innerText = parseFloat(sensEl.value).toFixed(1);

    // spawn rate binding
    const spawnRateEl = document.getElementById('spawnRate');
    const spawnRateVal = document.getElementById('spawnRateVal');
    spawnRateEl && spawnRateEl.addEventListener('input', ()=> spawnRateVal.innerText = spawnRateEl.value);

    // Advanced controls toggle (persisted)
    const advToggle = document.getElementById('advToggle'); const advControls = document.getElementById('advancedControls');
    try{ const showAdv = localStorage.getItem('showAdvanced') === '1'; if(advToggle){ advToggle.checked = showAdv; advControls.style.display = showAdv ? 'block' : 'none'; advToggle.addEventListener('change', ()=>{ advControls.style.display = advToggle.checked ? 'block' : 'none'; localStorage.setItem('showAdvanced', advToggle.checked ? '1' : '0'); }); } }catch(e){ if(advControls) advControls.style.display = 'none'; }


    // calibrate handler
    calibrateBtn && calibrateBtn.addEventListener('click', ()=>{ calibrateSensors(); });

    // damage flash & critical cleave settings
    let damageFlash = 0; function triggerDamageFlash(a){ damageFlash = Math.max(damageFlash, a); }
    const criticalPx = 12; // tighter than perfect
    const cleaveRadius = Math.min(220, Math.floor(Math.min(W,H)*0.22));

    // Notify / swing test
    const notifyToggle = document.getElementById('notifyToggle');
    const swingTestBtn = document.getElementById('swingTest');
    const toasts = document.getElementById('toasts');
    const swingLog = document.getElementById('swingLog');
    const clearLog = document.getElementById('clearLog');
    let notifyEnabled = false; let swingHistory = [];
    notifyToggle && notifyToggle.addEventListener('change', ()=>{ notifyEnabled = notifyToggle.checked; });
    swingTestBtn && swingTestBtn.addEventListener('click', ()=>{ onSwing(); notifySwing(null,'manual'); });
    clearLog && clearLog.addEventListener('click', ()=>{ swingHistory.length = 0; if(swingLog) swingLog.innerHTML = ''; });

    function showToast(text, small=false, time=900){ const d = document.createElement('div'); d.className = 'toast' + (small? ' small':''); d.innerText = text; toasts.appendChild(d); setTimeout(()=>{ d.style.transition = 'transform 250ms, opacity 250ms'; d.style.transform = 'translateX(8px)'; d.style.opacity = '0'; setTimeout(()=>d.remove(), 300); }, time); }
    function notifySwing(mag, source='gyro'){ const t = new Date(); const entry = {t:t.toLocaleTimeString(), mag:mag, source}; swingHistory.unshift(entry); if(swingHistory.length>30) swingHistory.pop(); if(swingLog){ swingLog.innerHTML = ''; for(const s of swingHistory){ const li = document.createElement('li'); li.style.fontSize='12px'; li.innerText = `${s.t} [${s.source}] mag:${s.mag===null?'-':Math.round(s.mag)}`; swingLog.appendChild(li); } }
      if(notifyEnabled){ showToast(`Swing detected (${source}) ${mag?Math.round(mag):''}`); if('vibrate' in navigator) navigator.vibrate && navigator.vibrate(40); }
      // also visual micro-slash
      spawnSlash(W*0.5, H*0.45, 'good', true);
    }

    // Global error capture to help diagnose non-responsive buttons
    window.addEventListener('error', (evt)=>{
      const msg = evt && evt.message ? evt.message : String(evt);
      console.error('Captured error:', evt);
      try{ showToast('エラー: '+msg, false, 4000); const st = document.getElementById('status'); if(st) st.innerText = 'エラー: '+msg; const lg = document.getElementById('swingLog'); if(lg){ const li = document.createElement('li'); li.style.fontSize='12px'; li.innerText = 'Error: '+msg; lg.insertBefore(li, lg.firstChild); } }catch(e){ console.error(e); }
    });
    window.addEventListener('unhandledrejection', (evt)=>{
      console.error('Unhandled rejection', evt);
      const reason = evt.reason ? (evt.reason.message || String(evt.reason)) : 'Unknown';
      try{ showToast('UnhandledRejection: '+reason, false, 4000); const lg = document.getElementById('swingLog'); if(lg){ const li = document.createElement('li'); li.style.fontSize='12px'; li.innerText = 'Rejection: '+reason; lg.insertBefore(li, lg.firstChild); } }catch(e){ console.error(e); }
    });

    // Diagnostic routine: ensure buttons are enabled and report
    setTimeout(()=>{
      try{
        if(connectBtn) connectBtn.disabled = false;
        if(startBtn) startBtn.disabled = false;
        if(swingTestBtn) swingTestBtn.disabled = false;
        showToast('診断: UI 初期化済み', true, 900);
      }catch(e){ console.error('Diagnostic failure', e); }
    }, 300);

    // オートキャリブレーション: 数秒間サンプリングして閾値を推定
    async function calibrateSensors(){ showToast('キャリブレーション開始：数秒間静止してください...', true, 1800);
      const samples = {gyro:[], acc:[]}; const dur = 2200; const start = performance.now();
      while(performance.now() - start < dur){ samples.gyro.push(gyroCurrMag); samples.acc.push(accCurrMag); await new Promise(r=>setTimeout(r, 30)); }
      const gmax = Math.max(...samples.gyro); const gmean = samples.gyro.reduce((a,b)=>a+b,0)/samples.gyro.length; const gstd = Math.sqrt(samples.gyro.reduce((a,b)=>a+(b-gmean)*(b-gmean),0)/samples.gyro.length);
      const amax = Math.max(...samples.acc); const amean = samples.acc.reduce((a,b)=>a+b,0)/samples.acc.length; const astd = Math.sqrt(samples.acc.reduce((a,b)=>a+(b-amean)*(b-amean),0)/samples.acc.length);
      // decide thresholds: gyro thr = max(gmax*3, gmean + 3*gstd, 0.4)
      const suggestedGyro = Math.max(gmax*3, gmean + 3*gstd, 0.4);
      const suggestedAcc = Math.max(amax*2.5, amean + 3*astd, 0.12);
      // apply
      sensEl.value = suggestedGyro.toFixed(2); sensVal.innerText = parseFloat(sensEl.value).toFixed(2);
      accThrEl.value = suggestedAcc.toFixed(2); accThrVal.innerText = parseFloat(accThrEl.value).toFixed(2);
      showToast(`キャリブレーション完了: 推奨 Gyro=${suggestedGyro.toFixed(2)}, Acc=${suggestedAcc.toFixed(2)}`, false, 2800);
    }

    connectBtn.addEventListener('click', async ()=>{
      try{
        await ble.begin('STEP_ANALYSIS_AND_SENSOR_VALUES');
        status.innerText = 'ステータス: 接続済み - 振り検出可';
        orpheConnected = true; connectBtn.style.display='none';
        // Update raw values and *immediately* process gyro samples for snappier detection
        ble.gotGyro = g=>{ rawGyro = g; try{ handleGyro(g); }catch(e){} };
        ble.gotAcc = a=>{ rawAcc = a; };
        ble.onDisconnect = ()=>{ orpheConnected=false; status.innerText='ステータス: 切断'; connectBtn.style.display='inline-block' }; 
      }catch(e){ status.innerText='接続失敗'; console.error(e); }
    });

    // ---- ゲーム変数 ----
    let running = false;
    let enemies = [];
    let splits = [];
    let particles = [];
    let slashes = [];
    let score = 0, combo = 0;
    const travelTime = 1.6; // legacy, unused for enemies but kept for reference

    // background: layered starfield / fog
    let bgParticles = [];
    let bgTime = 0;
    const BG_MAX_STARS = Math.min(220, Math.floor((W*H)/18000));
    function initBackground(){ bgParticles = []; const count = Math.max(40, Math.min(220, Math.floor((W*H)/18000))); for(let i=0;i<count;i++){ const layer = Math.random(); bgParticles.push({ x: Math.random()*W, y: Math.random()*H, r: (0.6 + Math.random()*1.6) * (1 + layer*1.6), aBase: 0.18 + Math.random()*0.6, layer, vx: (Math.random()-0.5)*(0.02 + layer*0.12), vy: (layer*0.02 + 0.01) }); } }


    // screen shake & flash
    let screenShake = 0;
    const screenShakeDecay = 8.0;
    let screenFlash = 0;

    function triggerShake(mag){ screenShake = Math.max(screenShake, mag); }
    function flashScreen(a){ screenFlash = Math.max(screenFlash, a); }

    // 現在時刻関数（秒）
    // Use AudioContext time when available/running, otherwise fall back to performance.now()
    function now(){ try{ if(audioCtx && audioCtx.state && audioCtx.state !== 'suspended') return audioCtx.currentTime; }catch(e){} return performance.now() / 1000; }

    // 敵生成（BPMに合わせて継続的に生成）
    let nextSpawnTime = 0; let gameStartTime = 0;

    function spawnEnemy(){ const x = Math.random()*(W*0.6) + W*0.2; const z = 1.0;
      // type distribution: ~56% normal, ~12% fast, ~12% tank, ~8% brute
      const roll = Math.random(); let type = 'normal'; let speedZ = 0.16 + Math.random()*0.18; let hp = 1; let r = 28; let color = `hsl(${Math.floor(Math.random()*360)},60%,60%)`; let damage = 1;
      if(roll < 0.12){ type = 'fast'; speedZ = 0.35 + Math.random()*0.25; hp = 1; r = 20; color = '#7be37b'; damage = 1; }
      else if(roll < 0.24){ type = 'tank'; speedZ = 0.08 + Math.random()*0.06; hp = 3; r = 36; color = '#c56bff'; damage = 1; }
      else if(roll < 0.32){ type = 'brute'; speedZ = 0.14 + Math.random()*0.12; hp = 2; r = 34; color = '#ff6b3d'; damage = 2; }
      enemies.push({x,z,speedZ,hp,maxHp:hp,r, color, type, damage, attacked:false,dead:false,timeOfDeath:0}); }
    function spawnEnemySplit(e){ // create two halves
      const mag = Math.min(18, 6 + Math.random()*12);
      for(let i=-1;i<=1;i+=2){ splits.push({x:e.x + i*6, y:e.y, vx:i*(40 + Math.random()*80), vy:-40 - Math.random()*30, rot: (Math.random()-0.5)*2, drot: (Math.random()-0.5)*6, color:e.color, ttl:1.6}); }
      // big particles
      for(let i=0;i<28;i++){ const c = '#ff6b6b'; particles.push({x:e.x + (Math.random()-0.5)*16, y:e.y + (Math.random()-0.5)*16, dx:(Math.random()-0.5)*12, dy:(Math.random()-0.8)*12, ttl:0.6+Math.random()*1.0, color:c}); }
      triggerShake(18); flashScreen(0.36);
    }
    function scheduleEnemies(){ const bpm = parseFloat(bpmEl.value); const beat = 60/bpm; const baseChance = parseFloat(spawnRateEl ? spawnRateEl.value : 0.45); if(nextSpawnTime === 0) nextSpawnTime = now() + 0.25;
      const elapsed = gameStartTime ? Math.max(0, now() - gameStartTime) : 0; // seconds since game start
      // Faster ramp: reach full extra spawn chance in 30s (was 60s)
      const extra = Math.min(0.6, (elapsed / 30) * 0.6); // ramp up to +0.6 over 30s
      const spawnChance = Math.min(0.98, baseChance + extra);
      // Allow more concurrent enemies earlier: increase every 15s up to +3 (max 4)
      const maxLiving = 1 + Math.min(3, Math.floor(elapsed / 15)); // allow more concurrent enemies over time (max 4)
      while(nextSpawnTime < now() + 10){ if(Math.random() < spawnChance){ const aliveCount = enemies.filter(e => !e.dead).length; if(aliveCount < maxLiving) spawnEnemy(); } nextSpawnTime += beat; } }

    // 入力検出（振り / キー / タップ）
    let lastSwingAt = 0;
    function onSwing(strong=false){ const t = now(); // デバウンス
      if(t - lastSwingAt < 0.12) return; lastSwingAt = t;

        ctx.fillStyle = '#ff9b9b'; ctx.fillRect(dx, dy, Math.min(200, (gyroCurrMag/1000)*200), 8); ctx.fillStyle='#fff'; ctx.fillText(`Gyro ${gyroCurrMag.toFixed(1)}`, dx, dy+26);
        // draw small gyro history graph
        ctx.beginPath(); ctx.strokeStyle = '#6be3ff'; for(let i=0;i<gyroHistory.length;i++){ const v = gyroHistory[i]; const x = dx + (i/gyroHistory.length)*200; const h = Math.min(64, v/8); const y = dy+40 + 64 - h; if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); } ctx.stroke();
        // acc bars and history
        const adx = dx + 208; ctx.fillStyle = '#ffd86b'; ctx.fillRect(adx, dy, Math.min(200, accCurrMag*60), 8); ctx.fillStyle='#fff'; ctx.fillText(`Acc ${accCurrMag.toFixed(2)}`, adx, dy+26);
        ctx.beginPath(); ctx.strokeStyle = '#ffd86b'; for(let i=0;i<accHistory.length;i++){ const v = accHistory[i]; const x = adx + (i/accHistory.length)*90; const h = Math.min(64, v*40); const y = dy+40 + 64 - h; if(i===0) ctx.moveTo(x,y); else ctx.lineTo(x,y); } ctx.stroke(); ctx.restore(); }

      requestAnimationFrame(draw);
    }
    draw();

    // デバッグ用: 外部から操作できる関数
    window._onSwing = onSwing;
    window._startGame = startGame;
    window._stopGame = stopGame;

    // 画面メッセージ
    message.innerHTML = `<div style="background:rgba(0,0,0,0.6);padding:12px;border-radius:8px;"><strong>敵が近づいてくる！剣で切り裂いて倒そう</strong><div style="margin-top:6px;color:#ddd;font-size:13px">ORPHE を振って敵を切る。近づいてきた敵が接触するとダメージを受けます。</div></div>`;
  </script>
</body>
</html>
